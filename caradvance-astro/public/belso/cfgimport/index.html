<!doctype html>
<html lang="hu" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<title>Konfigurátor-import — CarAdvance</title>
<style>
:root{--red:#E2001A;--ink:#0F172A;--mut:#5A6B82;--bg:#F4F5F7}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.c{max-width:460px;margin:60px auto;background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px rgba(15,23,42,.08);text-align:center}
.big{font-size:42px}.m{color:var(--mut);font-size:14px}
body>*:not(.c):not(script):not(style){display:none!important}
</style>
</head>
<body>
<div class="c" id="c"><div class="big">⏳</div><h2>Konfigurátor-import</h2><p class="m">Várakozás a gyártói oldal adataira…</p></div>
<script>
(function(){
'use strict';
// a könyvjelző (bookmarklet) a gyártó konfigurátor-oldaláról postMessage-dzsel küldi az oldal szövegét és képeinek címét;
// itt (a CarAdvance saját domainjén) eltároljuk, és a nyitott Ügyfél adatlap átveszi (storage esemény)
var OK=/^https:\/\/([a-z0-9-]+\.)*(bmw|mini|mercedes-benz|mercedes|audi|volkswagen|vw)\.[a-z.]{2,12}$/i;
var done=false,c=document.getElementById('c');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
window.addEventListener('message',function(e){
  if(done||!OK.test(e.origin))return;
  var d=e.data;if(!d||d.type!=='ca-cfg'||!d.payload)return;
  var p=d.payload;
  try{
    var o={u:String(p.u||'').slice(0,3000),t:String(p.t||'').slice(0,300),x:(Array.isArray(p.x)?p.x:[]).slice(0,6000).map(function(s){return String(s).slice(0,400);}),i:(Array.isArray(p.i)?p.i:[]).slice(0,60),at:Date.now()};
    localStorage.setItem('ca_cfg_import',JSON.stringify(o));
  }catch(err){c.innerHTML='<div class="big">⚠️</div><h2>Nem sikerült</h2><p class="m">'+esc(err.message)+'</p>';return;}
  done=true;
  try{e.source.postMessage({type:'ca-cfg-ack'},e.origin);}catch(err){}
  c.innerHTML='<div class="big">✅</div><h2>Átküldve a CRM-be</h2><p class="m">'+esc(p.t||'')+'<br>'+((p.x||[]).length)+' szövegsor · '+((p.i||[]).length)+' kép. Az Ügyfél adatlapon az ajánlatkészítőben megjelenik. Ez az ablak bezárható.</p>';
  setTimeout(function(){try{window.close();}catch(err){}},2500);
});
if(window.opener)try{window.opener.postMessage({type:'ca-cfg-ready'},'*');}catch(e){}
})();
</script>
</body>
</html>
