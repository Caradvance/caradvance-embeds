<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ügyfél adatlap — CarAdvance</title>
<link rel="icon" href="https://www.caradvance.hu/favicon.ico?v=2">
<style>
  :root{
    --red:#E2001A;--red-tint:#fdeceb;--red-tint2:#f8c9c9;--ink:#161922;--muted:#6b7280;--faint:#9aa2b0;
    --line:#ECEEF2;--line2:#F5F6F8;--bg:#F6F7FB;--card:#fff;--good:#128a63;--warn:#a97b1a;--bad:#c0392b;
    --shadow:0 1px 2px rgba(20,28,44,.04),0 1px 10px rgba(20,28,44,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:inherit}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  .top-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;color:var(--muted);padding:7px 10px;border-radius:9px;background:var(--line2)}
  .back:hover{color:var(--ink)}
  .who{flex:1;min-width:200px}
  .who h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .who .sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
  .who .sub a{color:var(--ink);font-weight:700;text-decoration:none}
  .who .sub a:hover{color:var(--red)}
  .stbox{display:flex;align-items:center;gap:8px}
  .stbox select{font:inherit;font-weight:700;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .savest{font-size:12px;color:var(--faint);min-width:70px;text-align:right}
  .savest.ok{color:var(--good)}.savest.err{color:var(--bad)}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px 3px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;background:var(--line2);color:#5b6472}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .tag.berles::before{background:#3a63b0}.tag.eladas::before{background:#128a63}.tag.import::before{background:#c07a1e}.tag.bizomanyos::before{background:#7a3ea8}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 20px 80px}
  .jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .jump a{font-size:12.5px;font-weight:700;text-decoration:none;color:#5b6472;background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:999px}
  .jump a:hover{color:var(--red);border-color:var(--red-tint2)}
  .sec{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;scroll-margin-top:90px}
  .sec>.sh{padding:15px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sec>.sh h2{margin:0;font-size:15px;font-weight:800}
  .sec>.sh .num{width:26px;height:26px;border-radius:8px;background:var(--red-tint);color:var(--red);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .sec>.sh .sp{flex:1}
  .sec>.sb{padding:16px 18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.grid,.grid.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid,.grid.g2,.grid.g4{grid-template-columns:1fr}}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#c9ced8}
  .fld.wide{grid-column:1/-1}
  .seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
  .seg button{font:inherit;font-weight:700;font-size:13px;border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:#5b6472}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .sub-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
  .chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
  .chk input{width:18px;height:18px;accent-color:var(--red);flex:0 0 auto;margin:0}
  .phase-h{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;color:var(--ink);margin:0 0 10px;padding:8px 12px;background:var(--line2);border-radius:10px}
  .phase-h .sp{flex:1}.phase-h .pp{font-size:12.5px;min-width:36px;text-align:right}
  .prog.sm{max-width:140px;min-width:80px;height:6px;display:inline-block}
  .cl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(max-width:640px){.cl{grid-template-columns:1fr}}
  .cl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer}
  .cl .it.done{background:#f1faf6;border-color:#cfe9dd}
  .cl .it .lb{font-weight:700;font-size:13.5px}
  .cl .it .meta{font-size:11px;color:var(--faint);margin-left:auto;text-align:right}
  .cl .it.last{border-style:dashed}
  .prog{height:6px;border-radius:999px;background:var(--line2);overflow:hidden;flex:1;min-width:120px;max-width:260px}
  .prog i{display:block;height:100%;background:var(--good)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn.red{background:var(--red);color:#fff}.btn.red:hover{filter:brightness(.93)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:#d3d8e0}
  .btn.sm{padding:7px 11px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:default}
  .hint{font-size:12px;color:var(--muted)}
  .note{background:#fff8e6;border:1px solid #f3e2b3;color:#7a5a0d;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
  /* ajánlat */
  .inv-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .inv-tools input[type=search]{flex:1;min-width:180px;font:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px}
  .inv{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .inv .row{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
  .inv .row:last-child{border-bottom:0}
  .inv .row:hover{background:var(--line2)}
  .inv .row.on{background:#fff4f4}
  .inv .row input{width:18px;height:18px;accent-color:var(--red);flex:0 0 auto}
  .inv .th{width:72px;height:50px;border-radius:7px;background:var(--line2) center/cover no-repeat;flex:0 0 auto}
  .inv .tt{flex:1;min-width:0}
  .inv .tt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inv .tt span{font-size:11.5px;color:var(--muted)}
  .inv .pr{font-weight:800;font-size:13px;white-space:nowrap}
  .inv .off{font-size:10px;font-weight:700;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px}
  .picked{margin-top:14px;display:grid;gap:10px}
  .pk{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
  .pk .prow{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:10px;align-items:end}
  .pk .specg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pk .specg .fld input{padding:7px 9px;font-size:12.5px}
  .pk .pth{width:54px;height:38px;border-radius:7px;background:var(--line2) center/cover no-repeat;flex:0 0 auto}
  .pk .idrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;background:var(--line2);border-radius:9px;padding:8px 10px}
  .pk .idrow label{font-size:11.5px;font-weight:700;color:var(--muted)}.pk .idrow input,.pk .idrow select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .pk .idrow a{font-weight:700;color:var(--ink)}
  .pk .paste{font-size:12.5px;background:#fff7e6;border:1px solid #f3dca8;border-radius:9px;padding:9px 11px;color:#6b4a07}.pk .paste textarea{width:100%;margin-top:7px;font:inherit;font-size:12px;border:1px solid #e6cf9a;border-radius:7px;padding:7px}
  .sbadge{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--line2);color:#5b6472;white-space:nowrap}.sbadge.mobile{background:#e8f0fb;color:#2a5aa8}.sbadge.config{background:#efe8fb;color:#6a3ea8}.sbadge.inv{background:#e7f6ef;color:var(--good)}
  .otabs{flex-wrap:wrap}
  .drop{border:2px dashed #d3d8e0;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fcfcfd}.drop.on{border-color:var(--red);background:var(--red-tint)}.drop span{font-size:12.5px;color:var(--muted)}
  .req{border:1px solid #f3dca8;background:#fffaf0;border-radius:12px;padding:12px 14px;margin-bottom:14px}.req-h{font-weight:800;font-size:13px;margin-bottom:8px}
  .req-g{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}.req-g span{color:var(--muted)}
  .pk .t{font-weight:800;font-size:13px;grid-column:1/-1;display:flex;gap:8px;align-items:center}
  .pk .t .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
  @media(max-width:700px){.pk .prow{grid-template-columns:1fr 1fr}.pk .fld.n{grid-column:1/-1}.pk .specg{grid-template-columns:1fr 1fr}}
  .offers{margin-top:18px;display:grid;gap:10px}
  .of{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .of .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  .of .h b{font-size:13px}
  .of ul{margin:8px 0 0;padding-left:18px;font-size:12.5px}
  .of li.ch{font-weight:800;color:var(--good)}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
  .pill.wait{background:var(--line2);color:#5b6472}.pill.ok{background:#e7f6ef;color:var(--good)}.pill.mod{background:#fff3df;color:#a2660b}.pill.bad{background:#fdeceb;color:var(--bad)}
  /* szerződés */
  .ctr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.ctr{grid-template-columns:1fr}}
  .ctr textarea.tpl{width:100%;min-height:420px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
  .preview{border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-height:420px;max-height:640px;overflow:auto;font-size:12.5px;line-height:1.55;background:#fff}
  .preview h3{font-size:15px;margin:4px 0 8px}.preview h4{font-size:12.5px;color:var(--red);margin:12px 0 4px}
  .preview p{margin:0 0 3px}
  .preview .sig{display:flex;gap:30px;margin-top:34px}.preview .sig div{flex:1;border-top:1px solid #9aa2b0;padding-top:4px;font-weight:700}
  .preview mark{background:#fff3c4;padding:0 2px;border-radius:3px}
  .vars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:900px){.vars{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.vars{grid-template-columns:1fr}}
  .vars .fld input{padding:8px 10px;font-size:12.5px}
  details.vbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  details.vbox summary{cursor:pointer;font-weight:800;font-size:13px}
  .docs{display:grid;gap:8px}
  .doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
  .doc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .doc .sz{font-size:11.5px;color:var(--faint)}
  .doc a,.doc .del{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:none}
  .doc .del:hover{color:var(--bad)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .rent{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcfd}
  .rent-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13.5px;margin-bottom:10px}
  .rb{font-weight:800;border-radius:999px;padding:1px 7px;font-size:10.5px;white-space:nowrap}
  .rb.ok{background:#e7f6ef;color:var(--good)}.rb.warn{background:#fff3df;color:#a2660b}.rb.bad{background:#fdeceb;color:var(--bad)}
  .rb.big{font-size:12px;padding:4px 10px;margin-left:auto}
  .rem-list{display:grid;gap:6px}
  .rem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:#fff}
  .rem span{color:var(--muted)}.rem .st{margin-left:auto;font-size:12px;font-weight:700}
  .rem.due{border-color:#f3e2b3;background:#fff8e6}.rem.due .st{color:#a2660b}.rem.sent{opacity:.7}.rem.sent .st{color:var(--good)}
  .rem .x{cursor:pointer;color:var(--faint);font-size:18px;line-height:1;margin-left:6px}.rem .x:hover{color:var(--bad)}
  .rem-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .rem-add input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px}
  .rem-add .btn[disabled]{opacity:.45;cursor:not-allowed}
  .veh-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .vchip{display:flex;align-items:center;gap:9px;font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;max-width:320px}
  .vchip:hover{border-color:#d3d8e0}.vchip.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
  .vchip i{width:46px;height:34px;border-radius:7px;background:var(--line2) center/cover no-repeat;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-style:normal}
  .vchip span{min-width:0}.vchip b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vchip small{display:block;font-size:11px;color:var(--muted)}
  .vchip.sm{padding:7px 12px}
  .fin-veh{margin-bottom:14px}
  .vpick{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fcfcfd}
  .vpick .row .btn{margin-left:8px}
  .veh-form{margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
  .veh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .ctr-veh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .ctr-veh label{font-size:12px;font-weight:800;color:var(--muted)}
  .ctr-veh select{font:inherit;font-weight:700;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
  .fin-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:700px){.fin-kpis{grid-template-columns:repeat(2,1fr)}}
  .fin-kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .fin-kpi span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .fin-kpi b{display:block;font-size:19px;font-weight:800;margin-top:4px;white-space:nowrap}
  .fin-kpi.pos b{color:var(--good)}.fin-kpi.neg b{color:var(--bad)}
  .fin-kpi.main{background:var(--line2);border-color:transparent}
  table.fin{width:100%;border-collapse:collapse;font-size:13px}
  table.fin th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.fin td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.fin td.am{text-align:right;white-space:nowrap;font-weight:800}
  table.fin td.am small{display:block;font-weight:500;color:var(--faint);font-size:11px}
  table.fin td small.nt{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  table.fin td.ac{white-space:nowrap;text-align:right}
  table.fin td.ac a,table.fin td.ac span{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:none;margin-left:8px}
  table.fin td.ac span.del:hover{color:var(--bad)}
  table.fin tfoot td{font-weight:800;border-bottom:0;border-top:1px solid var(--line)}
  @media(max-width:640px){table.fin thead{display:none}table.fin tr{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line2);padding:6px 0}table.fin td{border:0;padding:3px 4px}table.fin td.dt{grid-column:1/-1;font-size:11.5px;color:var(--faint)}table.fin td.ac{grid-column:1/-1;text-align:left}table.fin tfoot tr{display:grid}}
  .fin-form{border:1px dashed #d3d8e0;border-radius:12px;padding:14px;margin-top:16px;background:#fcfcfd}
  .fin-form .grid{grid-template-columns:2fr 1fr 90px 150px}
  @media(max-width:760px){.fin-form .grid{grid-template-columns:1fr 1fr}}
  .fin-sub{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:13.5px;font-weight:800}
  .fin-sub .sum{margin-left:auto;font-size:13px}
  .log{position:relative;margin:0;padding:0;list-style:none}
  .log li{display:grid;grid-template-columns:132px 28px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line2)}
  .log li:last-child{border-bottom:0}
  .log .t{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px}
  .log .t b{display:block;color:var(--ink);font-size:12.5px}
  .log .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--line2)}
  .log .ic.status{background:#e8eefb}.log .ic.client,.log .ic.opened{background:#e7f6ef}.log .ic.offer{background:#fff3df}.log .ic.contract,.log .ic.draft{background:#f1e9f8}.log .ic.checklist{background:#e7f6ef}.log .ic.start{background:var(--red-tint)}
  .log .x{font-size:13.5px;line-height:1.45;word-break:break-word}
  .log .x small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
  .log-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .log-tools button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:#5b6472;border-radius:999px;padding:5px 11px;cursor:pointer}
  .log-tools button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media(max-width:560px){.log li{grid-template-columns:28px 1fr}.log .t{grid-column:2;grid-row:2;padding-top:0}.log .ic{grid-row:1/3}}
  .loading{padding:60px 20px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:90;display:none;max-width:92vw}
  .toast.show{display:block}
  @media(max-width:640px){
    .top-in{padding:10px 14px;gap:10px}
    .wrap{padding:14px 12px 80px}
    .stbox{width:100%}.stbox select{flex:1}
    .sec>.sb{padding:14px}
  }
  .dm-list{display:grid;gap:8px;margin-bottom:14px}
  .dm-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
  .dm-row.on{border-color:var(--red-tint2);background:#fffafa}
  .dm-row input{width:18px;height:18px;accent-color:var(--red);flex:0 0 auto;margin:0}
  .dm-row .ic{font-size:18px;flex:0 0 auto}
  .dm-row .nm{flex:1;min-width:0}.dm-row .nm b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dm-row .nm small{font-size:11.5px;color:var(--muted)}
  .dm-row .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .lnk{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--line2);border:0;border-radius:8px;padding:6px 9px;cursor:pointer}.lnk:hover{color:var(--ink)}.lnk.del:hover{color:var(--bad)}
  .dm-new,.dm-send,.dm-ed{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#fcfcfd}
  .dm-ed{border-color:var(--red-tint2);background:#fff}
  .dm-edh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .dm-send .rc{display:flex;gap:18px;flex-wrap:wrap}.dm-send .rc .chk{font-size:13.5px}
  @media(max-width:640px){.dm-row{flex-wrap:wrap}.dm-row .acts{width:100%;justify-content:flex-start;padding-left:28px}}
</style>
<link rel="stylesheet" href="/belso/belso-ui.css?v=4">
</head>
<body>
<div class="top"><div class="top-in">
  <a class="back" href="/belso/" id="backLink">← Ügyféllista</a>
  <div class="who"><h1 id="hName">Ügyfél adatlap</h1><div class="sub" id="hSub"></div></div>
  <div class="stbox"><select id="statusSel" aria-label="Státusz"></select><span class="savest" id="saveSt"></span></div>
</div></div>
<div class="wrap" id="root"><div class="loading">Betöltés…</div></div>
<div class="toast" id="toast"></div>
<script src="/belso/doc-render.js?v=2"></script>
<script>
var ID=parseInt(new URLSearchParams(location.search).get('id'),10);
var API='/api/belso-crm';
var S={};          // a teljes betöltött állapot
var INV=null;      // készlet
var PICK=[];       // ajánlatba jelölt autók
var CTS={};        // szerződés-piszkozatok sablononként ('' | Eladásnál 'berles' / 'eladas')
var CTPL='';       // aktuális sablon
var CT={text:'',vars:{},fields:[],dirty:false}; // az aktuális szerződés
function isSale(){return S.deal&&S.deal.line==='Eladás';}
var CVID='';       // a szerződés autója (autónként külön szerződés)
var VSEL='';       // a 2. szekcióban kijelölt autó
var FVID='';       // pénzügy: autó-szűrő ('' = összes)
function vehs(){return (S.card&&S.card.data&&S.card.data.vehicles)||[];}
function vehById(id){return vehs().filter(function(v){return v.id===id;})[0]||null;}
function vehName(v,i){if(!v)return '—';return v.title||[v.brand,v.model].filter(Boolean).join(' ')||('Autó '+((i==null?vehs().indexOf(v):i)+1));}
function ckey(){return CVID?CVID+(CTPL?':'+CTPL:''):CTPL;}
function draftOf(key){
  var c=S.card.contract||{},d=(c.drafts||{})[key];
  if(d)return d;
  // régi (autó nélküli) piszkozat → az első autóhoz tartozik
  var first=vehs()[0];
  if(!CVID||(first&&first.id===CVID))return CTPL?((c.drafts||{})[CTPL]||{}):(c.text?c:{});
  return {};
}
function useCt(){var key=ckey();if(!CTS[key]){var d=draftOf(key);CTS[key]={text:d.text||'',vars:d.vars||{},fields:[],dirty:false};}CT=CTS[key];}
function useTpl(t){CTPL=t;useCt();}
var LCLASS={'Eladás':'eladas','Import':'import','Bérlés':'berles','Bizományos':'bizomanyos'};
var LTAB={'Eladás':'eladas','Import':'import','Bérlés':'berles','Bizományos':'bizomanyos'};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function toast(t,ms){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},ms||2600);}
function api(path,opts){
  opts=opts||{};
  var init={method:opts.method||'GET',credentials:'same-origin',headers:{}};
  if(opts.body!==undefined){init.headers['content-type']='application/json';init.body=JSON.stringify(opts.body);}
  return fetch(API+path,init).then(function(r){
    if(r.status===401){location.href='/belso/?next='+encodeURIComponent('/belso/ugyfel/?id='+ID);throw new Error('Nincs bejelentkezve.');}
    if(opts.raw)return r.ok?r:r.json().then(function(j){throw new Error(j.error||'Hiba');});
    return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'Hiba');e.data=j;throw e;}return j;});
  });
}
function fmtDate(s){if(!s)return '—';var d=new Date(String(s).replace(' ','T')+(/Z$/.test(s)?'':'Z'));return isNaN(d)?s:d.toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function fmtPrice(n,cur){n=Math.round(Number(n)||0);var s=n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');return cur==='EUR'?s+' €':s+' Ft';}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' kB';}

/* ---------------- mentés állapotjelző ---------------- */
function saving(){var el=$('saveSt');el.className='savest';el.textContent='Mentés…';}
function saved(){refreshLog();var el=$('saveSt');el.className='savest ok';el.textContent='✓ Mentve';clearTimeout(saved._t);saved._t=setTimeout(function(){el.textContent='';},2500);}
function saveErr(e){var el=$('saveSt');el.className='savest err';el.textContent='Hiba!';toast('Mentési hiba: '+(e&&e.message||e),4500);}

/* ---------------- betöltés ---------------- */
if(!ID){$('root').innerHTML='<div class="loading">Hiányzó ügyfél-azonosító.</div>';}
else load();
function load(){
  api('/card/'+ID).then(function(j){
    S=j;
    S.card.data=normData(S.card.data,S.deal,S.card.address);
    $('backLink').href='/belso/#'+(LTAB[S.deal.line]||'');
    VSEL=CVID=(vehs()[0]||{}).id||'';
    useTpl(isSale()?'berles':'');renderHead();renderAll();
    if(CT.text)loadTemplateFields(false);
  }).catch(function(e){$('root').innerHTML='<div class="loading">'+esc(e.message)+'</div>';});
}
function normData(d,deal,addr){
  d=d||{};
  var p=d.person||{};
  return {
    kind:d.kind==='ceg'?'ceg':'magan',
    person:Object.assign({id_number:'',mother_name:'',birth_place:'',birth_date:'',residence:'',bank:'',licence:''},p,{name:p.name||deal.name||'',address:p.address||addr||'',phone:p.phone||deal.phone||'',email:p.email||deal.email||'',tax:p.tax||''}),
    company:Object.assign({name:'',address:'',tax:'',reg:''},d.company||{}),
    contact_differs:!!d.contact_differs,
    contact:Object.assign({name:'',role:'',phone:'',email:''},d.contact||{}),
    vehicles:(d.vehicles||[]).map(function(v){return Object.assign({id:'',title:'',brand:'',model:'',year:'',vin:'',plate:'',ad_id:'',config_code:'',color:'',engine:'',fuel:'',km:'',hybrid:false,source:'manual',key:'',price:0,currency:'HUF',period:'',deposit:0,image:'',url:'',rent_start:'',rent_end:'',reminders:[]},v);}),
    buyer:{kind:d.buyer&&d.buyer.kind==='ceg'?'ceg':'magan',person:Object.assign({name:'',address:'',phone:'',email:'',tax:'',id_number:'',mother_name:'',birth_place:'',birth_date:'',residence:'',bank:'',licence:''},(d.buyer&&d.buyer.person)||{}),company:Object.assign({name:'',address:'',tax:'',reg:''},(d.buyer&&d.buyer.company)||{})},
    notes:d.notes||'',
    request:d.request||''
  };
}
function renderHead(){
  var d=S.deal,p=S.card.data.person,co=S.card.data.company;
  var title=S.card.data.kind==='ceg'&&co.name?co.name:(p.name||d.name||'Névtelen');
  document.title=title+' — Ügyfél adatlap';
  $('hName').innerHTML=esc(title)+' <span class="tag '+(LCLASS[d.line]||'')+'">'+esc(d.line)+'</span>';
  var ph=p.phone||d.phone,em=p.email||d.email;
  $('hSub').innerHTML=(ph?'<a href="tel:'+esc(ph.replace(/[^\d+]/g,''))+'">📞 '+esc(ph)+'</a>':'')
    +(em?'<a href="mailto:'+esc(em)+'">✉ '+esc(em)+'</a>':'')
    +'<span>Jelentkezett: '+esc(fmtDate(d.created_at))+'</span>'
    +(d.ch?'<span>Csatorna: '+esc(d.ch)+'</span>':'');
  $('statusSel').innerHTML=S.statuses.map(function(s,i){return '<option'+(s===S.card.status?' selected':'')+'>'+esc(s)+'</option>';}).join('');
}
$('statusSel').addEventListener('change',function(){
  var v=this.value;saving();
  api('/card/'+ID,{method:'PATCH',body:{status:v}}).then(function(){S.card.status=v;saved();}).catch(saveErr);
});

function renderAll(){
  $('root').innerHTML=
    '<div class="jump"><a href="#s1">1. Ügyfél adatai</a><a href="#s2">2. Gépjárművek</a><a href="#s3">3. Checklist</a><a href="#s4">4. Ajánlat</a><a href="#s5">5. Szerződés és dokumentumok</a><a href="#s6">6. Pénzügy</a><a href="#s7">7. Történésnapló</a></div>'
    +'<section class="sec" id="s1"><div class="sh"><span class="num">1</span><h2>Ügyfél személyes adatai</h2></div><div class="sb" id="b1"></div></section>'
    +'<section class="sec" id="s2"><div class="sh"><span class="num">2</span><h2>Gépjárművek</h2></div><div class="sb" id="b2"></div></section>'
    +'<section class="sec" id="s3"><div class="sh"><span class="num">3</span><h2>Checklist</h2><span class="sp"></span><div class="prog"><i id="clProg"></i></div><span class="hint" id="clCnt"></span></div><div class="sb" id="b3"></div></section>'
    +'<section class="sec" id="s4"><div class="sh"><span class="num">4</span><h2>Ajánlat készítő</h2><span class="sp"></span><span class="hint">'+esc(S.deal.line)+' készlet</span></div><div class="sb" id="b4"></div></section>'
    +'<section class="sec" id="s5"><div class="sh"><span class="num">5</span><h2>Szerződés és dokumentumok</h2></div><div class="sb" id="b5"></div></section>'
    +'<section class="sec" id="s6"><div class="sh"><span class="num">6</span><h2>Pénzügy</h2><span class="sp"></span><span class="hint" id="finHead"></span></div><div class="sb" id="bFin"></div></section>'
    +'<section class="sec" id="s7"><div class="sh"><span class="num">7</span><h2>Történésnapló</h2><span class="sp"></span><span class="hint" id="logCnt"></span></div><div class="sb" id="b7"></div></section>';
  renderPersonal();renderVehicle();renderChecklist();renderOffer();renderContract();renderFin();renderLog();
}

/* ---------------- 1. személyes adatok ---------------- */
function inp(path,label,val,type,extra){
  return '<div class="fld'+(extra||'')+'"><label>'+esc(label)+'</label><input data-p="'+path+'" type="'+(type||'text')+'" value="'+esc(val)+'"></div>';
}
function renderPersonal(){
  var d=S.card.data,p=d.person,c=d.company,k=d.contact;
  var h='<div class="seg" id="kindSeg"><button data-k="magan" class="'+(d.kind==='magan'?'on':'')+'">Magánszemély</button><button data-k="ceg" class="'+(d.kind==='ceg'?'on':'')+'">Cég</button></div>';
  if(isSale())h='<div class="phase-h">1. ütem — Bérlő</div>'+h;
  h+='<div class="sub-h" style="margin-top:0">'+(d.kind==='ceg'?'Jelentkező':'Személyes adatok')+'</div><div class="grid">'
    +inp('person.name','Név',p.name)+inp('person.phone','Telefonszám',p.phone,'tel')+inp('person.email','E-mail',p.email,'email')
    +inp('person.address','Cím',p.address,'text',' wide')+(d.kind==='magan'?inp('person.tax','Adószám / adóazonosító',p.tax):'')+'</div>'
    +idBlock('person',p,d.kind==='ceg'?'A jelentkező / képviselő okmányadatai (szerződésekhez, meghatalmazásokhoz)':'Okmány- és szerződéses adatok');
  if(d.kind==='ceg'){
    h+='<div class="sub-h">Cég adatai</div><div class="grid">'
      +inp('company.name','Cégnév',c.name)+inp('company.tax','Adószám',c.tax)+inp('company.reg','Cégjegyzékszám',c.reg)
      +inp('company.address','Cím (székhely)',c.address,'text',' wide')+'</div>'
      +'<label class="chk" style="margin-top:16px"><input type="checkbox" id="cDiff"'+(d.contact_differs?' checked':'')+'> A kapcsolattartó adatai eltérnek a jelentkező adataitól</label>';
    if(d.contact_differs){
      h+='<div class="sub-h">Kapcsolattartó</div><div class="grid g4">'
        +inp('contact.name','Név',k.name)+inp('contact.role','Beosztás',k.role)+inp('contact.phone','Telefonszám',k.phone,'tel')+inp('contact.email','E-mail',k.email,'email')+'</div>';
    }
  }
  if(isSale()){
    var B=d.buyer,bp=B.person,bc=B.company;
    var same=(bp.name&&bp.name.trim().toLowerCase()===(p.name||'').trim().toLowerCase())||(bp.email&&bp.email.trim().toLowerCase()===(p.email||'').trim().toLowerCase())||(B.kind==='ceg'&&d.kind==='ceg'&&bc.name&&bc.name.trim().toLowerCase()===(c.name||'').trim().toLowerCase());
    h+='<div class="phase-h" style="margin-top:26px">2. ütem — Vevő <span class="hint">(a vevő a bérlőtől eltérő személy / cég)</span></div>'
      +(same?'<div id="buyerWarn" class="note" style="background:#fdeceb;border-color:#f8c9c9;color:#b8000f">Figyelem: a vevő adatai megegyeznek a bérlőével — a vevőnek különböznie kell a bérlőtől.</div>':'')
      +'<div class="seg" id="buyerSeg"><button data-k="magan" class="'+(B.kind==='magan'?'on':'')+'">Magánszemély</button><button data-k="ceg" class="'+(B.kind==='ceg'?'on':'')+'">Cég</button></div>'
      +(B.kind==='ceg'?'<div class="grid">'+inp('buyer.company.name','Cégnév',bc.name)+inp('buyer.company.tax','Adószám',bc.tax)+inp('buyer.company.reg','Cégjegyzékszám',bc.reg)+inp('buyer.company.address','Cím (székhely)',bc.address,'text',' wide')+'</div><div class="sub-h">Kapcsolattartó / képviselő</div>':'')
      +'<div class="grid">'+inp('buyer.person.name','Név',bp.name)+inp('buyer.person.phone','Telefonszám',bp.phone,'tel')+inp('buyer.person.email','E-mail',bp.email,'email')
      +inp('buyer.person.address','Cím',bp.address,'text',' wide')+(B.kind==='magan'?inp('buyer.person.tax','Adószám / adóazonosító',bp.tax):'')+'</div>'
      +idBlock('buyer.person',bp,'A vevő okmányadatai');
  }
  $('b1').innerHTML=h;
  var bs=$('buyerSeg');if(bs)bs.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;d.buyer.kind=b.getAttribute('data-k');renderPersonal();saveData();});
  $('kindSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;d.kind=b.getAttribute('data-k');renderPersonal();saveData();});
  var cd=$('cDiff');if(cd)cd.addEventListener('change',function(){d.contact_differs=this.checked;renderPersonal();saveData();});
  bindInputs($('b1'));
}
var ID_OPEN={};
function idBlock(path,p,title){
  var filled=['id_number','mother_name','birth_place','birth_date','residence','bank','licence'].filter(function(k){return p[k];}).length;
  return '<details class="vbox idb" data-idb="'+path+'"'+(ID_OPEN[path]||filled?' open':'')+' style="margin:14px 0 0"><summary>'+esc(title)+(filled?' <span class="hint">('+filled+' kitöltve)</span>':'')+'</summary><div class="grid" style="margin-top:12px">'
    +inp(path+'.id_number','Személyi ig. / személyi szám',p.id_number)+inp(path+'.mother_name','Anyja neve',p.mother_name)+inp(path+'.birth_place','Születési hely',p.birth_place)
    +inp(path+'.birth_date','Születési idő',p.birth_date,'date')+inp(path+'.licence','Vezetői engedély száma',p.licence)+inp(path+'.bank','Bankszámlaszám',p.bank)
    +inp(path+'.residence','Tartózkodási hely (ha eltér)',p.residence,'text',' wide')+'</div></details>';
}
function bindInputs(root){
  root.querySelectorAll('details.idb').forEach(function(dt){dt.addEventListener('toggle',function(){ID_OPEN[dt.getAttribute('data-idb')]=dt.open;});});
  root.querySelectorAll('input[data-p]').forEach(function(el){
    el.addEventListener('input',function(){
      setPath(el.getAttribute('data-p'),el.type==='checkbox'?el.checked:el.value);
      saveDataSoon();
    });
    if(el.type==='checkbox')el.addEventListener('change',function(){setPath(el.getAttribute('data-p'),el.checked);saveData();});
  });
}
function setPath(path,val){var parts=path.split('.'),o=S.card.data;for(var i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]];}o[parts[parts.length-1]]=val;}
var __dt=null;
function saveDataSoon(){clearTimeout(__dt);$('saveSt').className='savest';$('saveSt').textContent='…';__dt=setTimeout(saveData,800);}
function saveData(){
  clearTimeout(__dt);saving();
  return api('/card/'+ID,{method:'PATCH',body:{data:S.card.data}}).then(function(){saved();renderHead();if(isSale())updateBuyerWarn();}).catch(saveErr);
}

function updateBuyerWarn(){
  // a figyelmeztetést újrarajzolás nélkül frissítjük (a fókusz ne ugorjon el)
  var d=S.card.data,p=d.person,c=d.company,B=d.buyer,bp=B.person,bc=B.company;
  var same=(bp.name&&bp.name.trim().toLowerCase()===(p.name||'').trim().toLowerCase())||(bp.email&&bp.email.trim().toLowerCase()===(p.email||'').trim().toLowerCase())||(B.kind==='ceg'&&d.kind==='ceg'&&bc.name&&bc.name.trim().toLowerCase()===(c.name||'').trim().toLowerCase());
  var w=document.getElementById('buyerWarn');
  if(same&&!w){var seg=$('buyerSeg');if(seg){w=document.createElement('div');w.id='buyerWarn';w.className='note';w.style.cssText='background:#fdeceb;border-color:#f8c9c9;color:#b8000f';w.textContent='Figyelem: a vevő adatai megegyeznek a bérlőével — a vevőnek különböznie kell a bérlőtől.';seg.parentNode.insertBefore(w,seg);}}
  else if(!same&&w)w.remove();
}

/* ---------------- 2. gépjármű ---------------- */
var SRC_LBL={inv:'készletből',offer:'elfogadott ajánlat',manual:'kézi'};
var VPICK=false;
function renderVehicle(){
  var L=vehs();
  if(!vehById(VSEL))VSEL=(L[0]||{}).id||'';
  var v=vehById(VSEL);
  var h='<div class="veh-chips">'+L.map(function(x,i){
      return '<button class="vchip'+(x.id===VSEL?' on':'')+'" data-vid="'+esc(x.id)+'">'+(x.image?'<i style="background-image:url(\''+esc(x.image)+'\')"></i>':'<i class="ph">🚗</i>')+'<span><b>'+esc((i+1)+'. '+vehName(x,i))+'</b><small>'+esc(SRC_LBL[x.source]||'')+(x.price?' · '+fmtPrice(x.price,x.currency)+(x.period?'/'+esc(x.period):''):'')+rentBadge(x)+'</small></span></button>';
    }).join('')
    +'<button class="btn ghost sm" id="vehAddInv">+ Autó a készletből</button><button class="btn ghost sm" id="vehAddMan">+ Kézi felvitel</button></div>'
    +'<div id="vehPicker" class="vpick"'+(VPICK?'':' style="display:none"')+'><div class="inv-tools"><input type="search" id="vpQ" placeholder="Keresés a készletben — márka, modell…"><label class="chk" style="font-size:13px"><input type="checkbox" id="vpAct" checked> Csak aktív</label><button class="btn ghost sm" id="vpClose">Bezár</button></div><div class="inv" id="vpList"><div class="loading" style="padding:24px">Készlet betöltése…</div></div></div>';
  if(!L.length)h+='<div class="hint" style="margin-top:12px">Még nincs autó ennél az ügyfélnél. Válassz a készletből, add meg kézzel — vagy ha az ügyfél egy kiküldött ajánlatban kiválaszt egy autót, az automatikusan ide kerül.</div>';
  if(v){
    var i=L.indexOf(v);
    h+='<div class="veh-form"><div class="veh-h"><b>'+esc((i+1)+'. autó — '+vehName(v,i))+'</b><span class="hint">'+esc(SRC_LBL[v.source]||'')+'</span>'+(v.url?'<a class="hint" href="'+esc(v.url)+'" target="_blank" rel="noopener">weboldal ↗</a>':'')+'<span class="sp" style="flex:1"></span><button class="btn ghost sm" id="vehDel">Autó törlése</button></div>'
      +'<div class="grid g4">'+vinp('title','Megnevezés',v.title,' wide')
      +vinp('brand','Márka',v.brand)+vinp('model','Típus',v.model)+vinp('year','Évjárat',v.year)+vinp('vin','Alvázszám',v.vin)+vinp('plate','Rendszám',v.plate)
      +vinp('color','Szín',v.color)+vinp('engine','Motor',v.engine)+vinp('fuel','Üzemanyag',v.fuel)+vinp('km','Km',v.km)+(v.ad_id?vinp('ad_id','mobile.de azonosító',v.ad_id):'')+(v.config_code||S.deal.line==='Eladás'?vinp('config_code','Konfigurációs kód',v.config_code):'')

/* ---- bérlet: kezdet / vég / figyelmeztetések (Eladás 1. üteme és Bérlés) ---- */
function hasRent(){return S.deal.line==='Bérlés'||S.deal.line==='Eladás';}
function todayIso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);}
function addDaysIso(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function addMonthsIso(d,n){var p=d.split('-').map(Number),t=new Date(Date.UTC(p[0],p[1]-1+n,p[2]));if(t.getUTCDate()!==p[2])t=new Date(Date.UTC(p[0],p[1]-1+n+1,0));return t.toISOString().slice(0,10);}
function huD(d){if(!d)return '—';var p=d.split('-');return p[0]+'. '+p[1]+'. '+p[2]+'.';}
function rentState(v){
  if(!v||!v.rent_end)return null;
  var d=dayDiff(todayIso(),v.rent_end),due=(v.reminders||[]).some(function(r){return r.date&&r.date<=todayIso();});
  return {days:d,due:due,cls:d<0?'bad':(due||d<=30)?'warn':'ok',txt:d<0?Math.abs(d)+' napja lejárt':d===0?'ma jár le':d+' nap van hátra'};
}
function rentBadge(v){var r=rentState(v);if(!r)return '';return ' · <span class="rb '+r.cls+'">⏰ '+esc(r.txt)+'</span>';}
function rentBlock(v){
  var r=rentState(v),rs=(v.reminders||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var months=v.rent_start&&v.rent_end?Math.round(dayDiff(v.rent_start,v.rent_end)/30.44):'';
  return '<div class="rent"><div class="rent-h">Bérlet'+(S.deal.line==='Eladás'?' <span class="hint">(1. ütem)</span>':'')+(r?'<span class="rb big '+r.cls+'">⏰ '+esc(r.txt)+' · lejárat: '+huD(v.rent_end)+'</span>':'')+'</div>'
    +'<div class="grid g4"><div class="fld"><label>Bérlet kezdete</label><input type="date" id="rStart" value="'+esc(v.rent_start||'')+'"></div>'
    +'<div class="fld"><label>Futamidő (hónap)</label><input id="rMonths" inputmode="numeric" value="'+esc(months)+'" placeholder="pl. 12"></div>'
    +'<div class="fld"><label>Bérlet vége</label><input type="date" id="rEnd" value="'+esc(v.rent_end||'')+'"></div>'
    +'<div class="fld"><label>&nbsp;</label><div class="hint" style="padding-top:10px">'+(v.rent_start&&v.rent_end?esc(dayDiff(v.rent_start,v.rent_end))+' nap':'A futamidőből a vége automatikusan számolódik.')+'</div></div></div>'
    +'<div class="sub-h" style="margin-top:14px">Figyelmeztetések a lejárat előtt</div>'
    +(rs.length?'<div class="rem-list">'+rs.map(function(x){
        var past=x.date<=todayIso();
        return '<div class="rem'+(x.sent_at?' sent':past?' due':'')+'"><b>'+huD(x.date)+'</b><span>'+(x.days!=null?x.days+' nappal a lejárat előtt':'egyedi időpont')+(x.note?' · '+esc(x.note):'')+'</span><span class="st">'+(x.sent_at?'✓ értesítés elment':past?'ma / esedékes':'')+'</span><span class="x" data-rdel="'+esc(x.id)+'" title="Törlés">×</span></div>';
      }).join('')+'</div>':'<div class="hint">Még nincs figyelmeztetés.</div>')
    +'<div class="rem-add">'+[90,60,30,14,7].map(function(n){return '<button class="btn ghost sm" data-rq="'+n+'"'+(v.rent_end?'':' disabled title="Előbb add meg a bérlet végét"')+'>'+n+' nappal előtte</button>';}).join('')
    +'<span class="sp" style="flex:1"></span><input type="date" id="rDate"><input id="rNote" placeholder="megjegyzés (nem kötelező)"><button class="btn dark sm" id="rAdd">+ Időpont</button></div>'
    +'<div class="hint" style="margin-top:6px">Az esedékes figyelmeztetésekről a rendszer minden reggel e-mailt küld a munkatársaknak, és az ügyféllistán is jelzi a lejáró bérletet. A bérlet végének módosításakor a „… nappal előtte” időpontok automatikusan igazodnak.</div></div>';
}
function rid(v){var ids={},i=(v.reminders||[]).length+1;(v.reminders||[]).forEach(function(r){ids[r.id]=1;});while(ids['r'+i])i++;return 'r'+i;}
function bindRent(v){
  var st=$('rStart'),en=$('rEnd'),mo=$('rMonths');
  function syncRel(){(v.reminders||[]).forEach(function(r){if(r.days!=null&&!r.sent_at&&v.rent_end)r.date=addDaysIso(v.rent_end,-r.days);});}
  st.addEventListener('change',function(){v.rent_start=st.value;var m=parseInt(mo.value,10);if(v.rent_start&&m>0&&!v.rent_end){v.rent_end=addMonthsIso(v.rent_start,m);syncRel();}saveData().then(renderVehicle);});
  mo.addEventListener('change',function(){var m=parseInt(mo.value,10);if(v.rent_start&&m>0){v.rent_end=addMonthsIso(v.rent_start,m);syncRel();saveData().then(renderVehicle);}else if(!v.rent_start)toast('Előbb add meg a bérlet kezdetét.');});
  en.addEventListener('change',function(){v.rent_end=en.value;syncRel();saveData().then(renderVehicle);});
  $('b2').querySelectorAll('[data-rq]').forEach(function(b){b.addEventListener('click',function(){
    var n=parseInt(b.getAttribute('data-rq'),10);if(!v.rent_end)return;
    if((v.reminders||[]).some(function(r){return r.days===n;}))return toast('Ez a figyelmeztetés már szerepel.');
    v.reminders=(v.reminders||[]).concat([{id:rid(v),date:addDaysIso(v.rent_end,-n),days:n,note:'',sent_at:''}]);saveData().then(renderVehicle);
  });});
  $('rAdd').addEventListener('click',function(){
    var d=$('rDate').value;if(!d)return toast('Válassz dátumot.');
    v.reminders=(v.reminders||[]).concat([{id:rid(v),date:d,days:null,note:$('rNote').value.trim(),sent_at:''}]);saveData().then(renderVehicle);
  });
  $('b2').querySelectorAll('[data-rdel]').forEach(function(x){x.addEventListener('click',function(){var id=x.getAttribute('data-rdel');v.reminders=(v.reminders||[]).filter(function(r){return r.id!==id;});saveData().then(renderVehicle);});});
}
function vinp(k,label,val,extra){return '<div class="fld'+(extra||'')+'"><label>'+esc(label)+'</label><input data-vp="'+k+'" value="'+esc(val==null?'':val)+'"'+(k==='price'?' inputmode="decimal"':'')+'></div>';}
function newVid(){var L=vehs(),i=L.length+1,ids={};L.forEach(function(x){ids[x.id]=1;});while(ids['v'+i])i++;return 'v'+i;}
function addVehicle(v){
  v=Object.assign({id:newVid(),title:'',brand:'',model:'',year:'',vin:'',plate:'',ad_id:'',config_code:'',color:'',engine:'',fuel:'',km:'',hybrid:false,source:'manual',key:'',price:0,currency:'HUF',period:'',deposit:0,image:'',url:'',rent_start:'',rent_end:'',reminders:[]},v);
  S.card.data.vehicles=vehs().concat([v]);VSEL=v.id;VPICK=false;
  if(!CVID){CVID=v.id;useCt();}
  renderVehicle();renderContract();saveData().then(function(){renderFin();toast('Autó hozzáadva: '+vehName(v));});
}
function invToVehicle(it){
  var model=it.brand&&String(it.title).indexOf(it.brand)===0?String(it.title).slice(it.brand.length).trim():it.title;
  return {source:'inv',key:it.key,title:it.title,brand:it.brand||'',model:model||'',year:it.year||'',engine:it.power||'',fuel:it.fuel||'',km:it.km?String(it.km):'',hybrid:/hybrid|hibrid|phev/i.test(it.title+' '+(it.fuel||'')),price:it.price||0,currency:it.currency==='EUR'?'EUR':'HUF',period:it.period||'',deposit:it.deposit||0,image:it.image||'',url:it.url||''};
}
function renderVehPick(){
  var el=$('vpList');if(!el||!INV)return;
  var q=($('vpQ').value||'').toLowerCase().trim(),act=$('vpAct').checked,have={};vehs().forEach(function(v){if(v.key)have[v.key]=1;});

  el.innerHTML=rows.map(function(it){
    return '<div class="row'+(have[it.key]?' on':'')+'" data-key="'+esc(it.key)+'"><div class="th"'+(it.image?' style="background-image:url(\''+esc(it.image)+'\')"':'')+'></div>'
      +'<div class="tt"><b>'+esc(it.title)+(it.active?'':'<span class="off">inaktív</span>')+'</b><span>'+esc(spec(it))+'</span></div>'
      +'<div class="pr">'+fmtPrice(it.price,it.currency)+(it.period?'/'+esc(it.period):'')+'</div><button class="btn sm '+(have[it.key]?'ghost':'dark')+'">'+(have[it.key]?'Már hozzáadva':'Hozzáadás')+'</button></div>';
  }).join('')||'<div class="loading" style="padding:24px">Nincs találat.</div>';
  el.querySelectorAll('.row').forEach(function(r){r.addEventListener('click',function(){var k=r.getAttribute('data-key');if(have[k])return toast('Ez az autó már szerepel az ügyfélnél.');var it=INV.filter(function(x){return x.key===k;})[0];if(it)addVehicle(invToVehicle(it));});});

function invP(){if(!__invP)__invP=api('/inventory?line='+encodeURIComponent(S.deal.line)).then(function(j){INV=j.items;return INV;}).catch(function(e){__invP=null;throw e;});return __invP;}

/* ---------------- 3. checklist ---------------- */
function clItems(){return S.checklist.phases.reduce(function(a,p){return a.concat(p.items);},[]);}
function renderChecklist(){
  var cl=S.card.checklist||{},items=clItems(),rule=S.checklist.close,done=0;
  items.forEach(function(c){if(cl[c[0]]&&cl[c[0]].done)done++;});
  $('b3').innerHTML=S.checklist.phases.map(function(ph){
    var pd=ph.items.filter(function(c){return cl[c[0]]&&cl[c[0]].done;}).length,pp=Math.round(pd/ph.items.length*100);
    return (ph.title?'<div class="phase-h" style="margin-top:'+(ph===S.checklist.phases[0]?'0':'22px')+'">'+esc(ph.title)+'<span class="sp"></span><span class="prog sm"><i style="width:'+pp+'%;background:'+(pp===100?'var(--good)':'var(--red)')+'"></i></span><b class="pp">'+pp+'%</b></div>':'')
      +'<div class="cl">'+ph.items.map(function(c){
        var st=cl[c[0]]||{},last=rule===c[0];
        return '<label class="it'+(st.done?' done':'')+(last?' last':'')+'"><input type="checkbox" data-k="'+c[0]+'"'+(st.done?' checked':'')+' style="width:18px;height:18px;accent-color:var(--good)">'
          +'<span class="lb">'+esc(c[1])+(last?' <span class="hint">→ státusz: Lezárva</span>':'')+'</span>'
          +'<span class="meta">'+(st.done?esc(fmtDate(st.at))+(st.by?'<br>'+esc(st.by):''):'')+'</span></label>';
      }).join('')+'</div>';
  }).join('')+(rule==='all'?'<div class="hint" style="margin-top:12px">Ha mindkét ütem minden feladata kész, a státusz „Lezárva” lesz.</div>':'');
  var pct=Math.round(done/items.length*100);
  $('clProg').style.width=pct+'%';$('clProg').style.background=done===items.length?'var(--good)':'var(--red)';
  $('clCnt').innerHTML='<b style="color:var(--ink);font-size:14px">'+pct+'% kész</b> · '+done+' / '+items.length;
  $('b3').querySelectorAll('input[data-k]').forEach(function(el){
    el.addEventListener('change',function(){
      var k=el.getAttribute('data-k');
      var next={};items.forEach(function(c){next[c[0]]=!!(cl[c[0]]&&cl[c[0]].done);});
      next[k]=el.checked;
      var closes=el.checked&&(rule==='all'?items.every(function(c){return next[c[0]];}):k===rule);
      if(closes&&!confirm((rule==='all'?'Ezzel minden checklist-feladat kész':'A(z) „'+((items.filter(function(c){return c[0]===rule;})[0]||[])[1]||rule)+'” kipipálásával')+' — az ügyfél státusza „Lezárva” lesz. Folytatod?')){el.checked=false;return;}
      saving();
      api('/card/'+ID,{method:'PATCH',body:{checklist:next}}).then(function(r){
        S.card.checklist=r.checklist;if(r.status&&r.status!==S.card.status){S.card.status=r.status;renderHead();toast('Státusz: '+r.status);}
        renderChecklist();saved();
      }).catch(function(e){el.checked=!el.checked;saveErr(e);});
    });
  });
}

/* --- gyári konfigurátor (PDF) --- */
var __pdfjs=null;
function pdfjs(){
  if(__pdfjs)return __pdfjs;
  __pdfjs=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};s.onerror=function(){__pdfjs=null;rej(new Error('A PDF-olvasó nem töltődött be.'));};document.head.appendChild(s);});
  return __pdfjs;
}
function pdfText(buf){
  return pdfjs().then(function(lib){return lib.getDocument({data:buf}).promise;}).then(function(doc){
    var pages=[];for(var p=1;p<=Math.min(doc.numPages,12);p++)pages.push(p);
    return Promise.all(pages.map(function(n){return doc.getPage(n).then(function(pg){return pg.getTextContent();}).then(function(tc){
      var lines=[],cur=null,lastY=null;
      tc.items.forEach(function(it){var y=Math.round(it.transform[5]);if(lastY===null||Math.abs(y-lastY)>2){cur=[];lines.push(cur);lastY=y;}cur.push(it.str);});
      return lines.map(function(l){return l.join(' ').replace(/\s+/g,' ').trim();}).filter(Boolean).join('\n');
    });})).then(function(a){return a.join('\n');});
  });
}
function eurNum(s){s=String(s).replace(/\s/g,'');if(/,\d{2}$/.test(s))s=s.slice(0,-3);else if(/\.\d{2}$/.test(s)&&!/\.\d{3}\.\d{2}$/.test(s))s=s.slice(0,-3);return parseInt(s.replace(/[^\d]/g,''),10)||0;}
function parseConfig(text){
  var t=String(text),o={};
  var cnt=function(re){return (t.match(re)||[]).length;};
  var bs=[['BMW',cnt(/\bBMW\b/g)],['Mercedes-Benz',cnt(/Mercedes/g)],['Audi',cnt(/\bAudi\b/g)],['Volkswagen',cnt(/Volkswagen|\bVW\b/g)]].sort(function(a,b){return b[1]-a[1];});
  if(bs[0][1])o.brand=bs[0][0];
  var cm=t.match(/(?:Audi\s*Code|BMW\s*Code|Konfigurations-?\s*(?:code|ID|nummer)|Configuration\s*code|Ihr\s*Code|Fahrzeugcode|Konfigurációs\s*kód)\s*[:#]?\s*([A-Z0-9][A-Z0-9-]{4,15})/i)
    ||t.match(/\bCode\s*[:#]\s*([A-Z0-9]{5,14})\b/);
  if(cm)o.config_code=cm[1].toUpperCase();
  // ár: a „Gesamtpreis / Fahrzeugpreis / Gesamtsumme / Kaufpreis / Total” sorok közül a legnagyobb összeg, különben a legnagyobb €-összeg
  var priceRe=/(\d{1,3}(?:[.\s]\d{3})+(?:,\d{2})?|\d{4,7}(?:,\d{2})?)\s*(?:€|EUR)|(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})+(?:,\d{2})?|\d{4,7}(?:,\d{2})?)/g;
  var best=0,any=0;
  t.split('\n').forEach(function(l){
    var m,mx=0;priceRe.lastIndex=0;while((m=priceRe.exec(l)))mx=Math.max(mx,eurNum(m[1]||m[2]));
    if(!mx)return;any=Math.max(any,mx);
    if(/Gesamt|Fahrzeugpreis|Kaufpreis|Summe|Total|Endpreis|Barpreis|Hauspreis|Angebotspreis|Ihr\s*Preis|Végösszeg/i.test(l))best=Math.max(best,mx);
  });
  o.price=best||any;
  var pw=t.match(/(\d{2,4})\s*kW\s*\(\s*(\d{2,4})\s*PS\s*\)/);if(pw)o.power=pw[1]+' kW ('+pw[2]+' LE)';
  var fu=t.match(/\b(Plug-in-Hybrid|Hybrid|Elektro|Diesel|Benzin)\b/i);if(fu)o.fuel={diesel:'dízel',benzin:'benzin',elektro:'elektromos',hybrid:'hibrid','plug-in-hybrid':'plug-in hibrid'}[fu[1].toLowerCase()]||fu[1];
  var col=t.match(/(?:Außenfarbe|Lackierung|Farbe)\s*[:\n]\s*([^\n]{3,48})/i);if(col&&!/€/.test(col[1]))o.color=col[1].trim();
  // modell: az első rövid sor, ami a márkát / tipikus modellnevet tartalmazza
  var models=/\b(BMW\s+\S+|[1-8]er|X[1-7]|i[3-8X]|iX\d?|Z4|M\d|[ABCEGS]LA?\s?\d{3}|GL[ABCES]\s?\d{3}|EQ[ABCES]|[ACEGS]-Klasse|AMG\s+\S+|Audi\s+\S+|A[1-8]|Q[2-8]|RS\s?\d|S[1-8]|e-tron|Golf|Polo|Passat|Tiguan|Touareg|T-Roc|T-Cross|Taigo|Arteon|ID\.\s?\d|Touran|Caddy|Multivan|Amarok)\b/;
  var lines=t.split('\n');
  for(var i=0;i<Math.min(lines.length,80);i++){var l=lines[i];if(l.length>3&&l.length<90&&models.test(l)&&!/GmbH|\bAG\b|www\.|Seite|Konfigurat|€|Datum|Händler|Preis|Tel\.|Code/i.test(l)){o.title=l.trim();break;}}
  if(o.title)o.title=o.title.replace(/^(Ihr|Ihre|Mein|Your)\s+/i,'');if(o.title&&o.brand&&o.title.indexOf(o.brand.split('-')[0])<0)o.title=o.brand+' '+o.title;
  return o;
}
function cfgFiles(files){
  if(!files.length)return;
  var st=$('cfgSt');var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      if(file.size>9*1024*1024){toast(file.name+': túl nagy (max. 9 MB)',4000);return;}
      st.textContent='Feldolgozás: '+file.name+'…';

            config_code:d.config_code||'',power:d.power||'',fuel:d.fuel||'',color:d.color||'',file_id:r.file.id,file_name:file.name,note:'',needCheck:true});

function loadTemplateFields(reset){

function renderPreview(){
  var el=$('preview');if(!el)return;
  if(window.CADoc){el.className='preview dpv';el.innerHTML=CADoc.preview(CT.text,CT.vars);return;}
  var out=[],lines=CT.text.split('\n');
  lines.forEach(function(raw){
    var ln=esc(raw).replace(/\{\{\s*([a-z0-9_]+)\s*\}\}/g,function(m,k){var v=CT.vars[k];return v&&String(v).trim()?esc(v):'<mark>'+esc(k)+'</mark>';});
    if(!raw.trim())out.push('<div style="height:7px"></div>');
    else if(raw.indexOf('# ')===0)out.push('<h3>'+ln.slice(2)+'</h3>');
    else if(raw.indexOf('## ')===0)out.push('<h4>'+ln.slice(3)+'</h4>');
    else if(/^\[aláírás\]/i.test(raw)){var parts=ln.replace(/^\[aláírás\]\s*/i,'').split('|');out.push('<div class="sig"><div>'+(parts[0]||'')+'</div><div>'+(parts[1]||'')+'</div></div>');}
    else out.push('<p>'+ln+'</p>');
  });
  el.innerHTML=out.join('');
}

function sendContract(){

function renderDocs(){
  var el=$('docs');if(!el)return;

  el.innerHTML=S.files.map(function(f){

      +'<a href="'+API+'/card/'+ID+'/files/'+f.id+'" target="_blank" rel="noopener">Megnyitás</a><span class="del" data-del="'+f.id+'">Törlés</span></div>';

function uploadDocs(e){
  var list=[].slice.call(e.target.files||[]);e.target.value='';
  var chain=Promise.resolve();
  list.forEach(function(file){
    chain=chain.then(function(){
      if(file.size>9*1024*1024){toast(file.name+': túl nagy (max. 9 MB)',4000);return;}
      return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=rej;fr.readAsDataURL(file);}).then(function(data){
        return api('/card/'+ID+'/files',{method:'POST',body:{name:file.name,mime:file.type||'application/octet-stream',data:data}});
      }).then(function(r){S.files.push(r.file);renderDocs();refreshLog();toast('Feltöltve: '+file.name);}).catch(function(err){toast(file.name+': '+err.message,4500);});

  });

    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var max=2000,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      var q=0.85,d=c.toDataURL('image/jpeg',q);while(d.length*0.75>1300*1024&&q>0.4){q-=0.1;d=c.toDataURL('image/jpeg',q);}res({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:d});};
    img.onerror=function(){rej(new Error('A kép nem olvasható.'));};img.src=u;
  });
}
function saveFin(){
  var v=readFinForm();
  if(!v.title)return toast('Add meg a megnevezést.');
  var amt=parseFloat(String(v.amount).replace(/\s/g,'').replace(',','.'));
  if(!(amt>0))return toast('Add meg az összeget.');
  v.amount=amt;
  var file=$('fFile').files[0];
  if(file&&file.size>1400*1024&&!/^image\//.test(file.type))return toast('A PDF legfeljebb 1,4 MB lehet.',4000);
  var b=$('fSave');b.disabled=true;b.textContent='Mentés…';
  (file?fileToData(file):Promise.resolve(null)).then(function(fd){
    var body=Object.assign({},v);if(fd)body.file=fd;
    if(FE){
      if(FE.currency==='EUR'&&v.currency==='EUR'&&Number(FE.amount)===amt&&FE.fx)body.fx=FE.fx; // csak szöveg módosult → marad a rögzített árfolyam
      if($('fRmFile')&&$('fRmFile').checked)body.removeFile=true;
      return api('/card/'+ID+'/fin/'+FE.id,{method:'PATCH',body:body});
    }
    return api('/card/'+ID+'/fin',{method:'POST',body:body});
  }).then(function(r){S.fin=r.fin;var was=!!FE;FE=null;renderFin();refreshLog();toast(was?'Tétel mentve':'Tétel hozzáadva');})
    .catch(function(e){toast(e.message,5000);b.disabled=false;b.textContent=FE?'Mentés':'Hozzáadás';});
}

/* ---------------- 7. történésnapló ---------------- */
var LOG_IC={status:'⇄',client:'★',opened:'👁',offer:'✉',contract:'📄',doc:'📑',draft:'✎',checklist:'✓',file:'📎',data:'👤',buyer:'🤝',fin:'💰',rent:'⏰',vehicle:'🚗',create:'＋',start:'●'};
var LOG_GROUP={'':'Mind',status:'Státusz',client:'Ügyfél',offer:'Ajánlat',contract:'Szerződés',checklist:'Checklist',fin:'Pénzügy'};
var logFilter='';
function renderLog(){
  var el=$('b7');if(!el)return;
  var ev=(S.events||[]).slice();
  ev.push({at:S.deal.created_at,actor:'',kind:'start',text:'Ügyfél jelentkezett'+(S.deal.ch?' ('+S.deal.ch+')':'')+(S.deal.car?' — '+S.deal.car:'')});
  var shown=ev.filter(function(e){
    if(!logFilter)return true;
    if(logFilter==='client')return e.kind==='client'||e.kind==='opened';
    if(logFilter==='contract')return e.kind==='contract'||e.kind==='draft'||e.kind==='file'||e.kind==='doc';
    return e.kind===logFilter;
  });
  $('logCnt').textContent=ev.length+' bejegyzés';
  el.innerHTML='<div class="log-tools">'+Object.keys(LOG_GROUP).map(function(k){return '<button data-k="'+k+'" class="'+(k===logFilter?'on':'')+'">'+LOG_GROUP[k]+'</button>';}).join('')+'</div>'
    +(shown.length?'<ul class="log">'+shown.map(function(e){
      var d=new Date(String(e.at).replace(' ','T')+(/Z$/.test(e.at)?'':'Z')),ok=!isNaN(d);
      return '<li><div class="t"><b>'+(ok?d.toLocaleDateString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit'}):esc(e.at))+'</b>'+(ok?d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}):'')+'</div>'
        +'<div class="ic '+esc(e.kind)+'">'+(LOG_IC[e.kind]||'•')+'</div>'
        +'<div class="x">'+esc(e.text)+(e.actor?'<small>'+esc(e.actor)+'</small>':'')+'</div></li>';
    }).join('')+'</ul>':'<div class="hint">Nincs ilyen bejegyzés.</div>');
  el.querySelectorAll('.log-tools button').forEach(function(b){b.addEventListener('click',function(){logFilter=b.getAttribute('data-k');renderLog();});});
}
var __lt=null;
function refreshLog(){clearTimeout(__lt);__lt=setTimeout(function(){api('/card/'+ID+'/events').then(function(j){S.events=j.events;renderLog();}).catch(function(){});},400);}
window.addEventListener('beforeunload',function(e){if(Object.keys(CTS).some(function(k){return CTS[k].dirty;})){e.preventDefault();e.returnValue='';}});
</script>
