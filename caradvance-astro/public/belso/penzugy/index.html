<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pénzügy — CarAdvance belső</title>
<link rel="icon" href="/favicon-32.png">
<!-- ca-tracking:start --><!-- belső felület: nincs követés --><!-- ca-tracking:end -->
<style>
:root{--red:#E2001A;--navy:#22447d;--ink:#161922;--mut:#5A6B82;--line:#E6EAF1;--bg:#F4F5F7;--ok:#15803D;--okbg:#DCFCE7;--warn:#92400E;--warnbg:#FEF3C7;--errbg:#FDE8EB;--neg:#B42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--navy)}
header{background:#0B0B0D;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:30px}header .sp{flex:1}header a{color:#cbd2dc;text-decoration:none;font-size:13px}
main{max-width:1320px;margin:0 auto;padding:14px 18px 60px}
.card{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 6px 20px rgba(15,23,42,.05);margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16.5px}.card h3{margin:14px 0 8px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 15px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;background:#EEF2F7;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.red{background:var(--red);color:#fff}.btn.navy{background:var(--navy);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ink);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font:600 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.cnt{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;font-size:11.5px;margin-left:5px;text-align:center}
.cnt.grey{background:#CBD5E1;color:#1e293b}
.in,select.in{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#F7F9FC;font:inherit;color:var(--ink);max-width:100%}
.in:focus{outline:none;border-color:var(--navy);background:#fff}
label.f{display:block;font-size:12px;font-weight:600;color:#334155}label.f .in{width:100%;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}.grid .full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--ok)}.muted{color:var(--mut)}.small{font-size:12.5px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:#EEF2F7;color:var(--mut);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.err{background:var(--errbg);color:#9f1239}.badge.navy{background:#e7eef9;color:var(--navy)}
.ldot{display:inline-block;flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;background:#F1F4F9;margin:1px 2px 1px 0;white-space:nowrap}
.note{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px}.note.warn{background:var(--warnbg);color:var(--warn)}.note.err{background:var(--errbg);color:#9f1239}.note.ok{background:var(--okbg);color:var(--ok)}.note.info{background:#EEF4FF;color:#1e3a8a}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(15,23,42,.05)}
.kpi span{display:block;font-size:12px;color:var(--mut);font-weight:600}.kpi b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}.kpi small{color:var(--mut)}
.kpi.alert{cursor:pointer;outline:2px solid #FCD34D}
.pl{overflow:auto}.pl table{min-width:640px}
.pl td,.pl th{padding:6px 10px}
.pl th:first-child,.pl td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:250px}
.pl tr.sec td{font-weight:800;padding-top:16px;border-bottom:0;color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pl tr.grp td:first-child{padding-left:18px;font-weight:700;cursor:pointer}
.pl tr.cat td:first-child{padding-left:30px;color:#334155}
.pl tr.cat.top td:first-child{padding-left:18px}
.pl tr.sub td{font-weight:700;background:#F8FAFC}.pl tr.sub td:first-child{background:#F8FAFC}
.pl tr.tot td{font-weight:800;background:#0B0B0D;color:#fff;border-bottom:0}.pl tr.tot td:first-child{background:#0B0B0D}.pl tr.tot td.neg{color:#ff8a80}
.pl tr.kpi2 td{font-weight:800;background:#EEF2F7}.pl tr.kpi2 td:first-child{background:#EEF2F7}
.pl tr.uncat td{background:#FFFBEB}.pl tr.uncat td:first-child{background:#FFFBEB}
.pl tr.memo td{color:var(--mut)}
.pl td.c{cursor:pointer}.pl td.c:hover{background:#EEF4FF;text-decoration:underline}
.pl tr.hide{display:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 0 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:18px;font-size:10.5px;color:var(--mut);position:relative;height:100%}
.bars i{display:block;width:70%;border-radius:4px 4px 0 0}
.tx td{font-size:13px}.tx tr:hover td{background:#F7F9FC}.tx tr{cursor:pointer}
.tx .p{font-weight:600}.tx .m{color:var(--mut);font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:1050px}
.modal h2{margin:0 0 4px;font-size:18px}.modal .x{float:right;border:0;background:#EEF2F7;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px}
.split label{display:flex!important;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;margin:0}
.split label>span:nth-child(2){flex:1;min-width:0;line-height:1.25}
.split input{flex:0 0 58px;width:58px!important;padding:4px 6px;border:1px solid var(--line);border-radius:7px;text-align:right;margin:0}
.drop{border:2px dashed #CBD5E1;border-radius:16px;padding:28px;text-align:center;color:var(--mut);background:#FAFBFD;cursor:pointer}
.drop.over{border-color:var(--navy);background:#EEF4FF}
.bulk{position:sticky;bottom:10px;background:#0B0B0D;color:#fff;border-radius:14px;padding:10px 14px;display:none;gap:8px;align-items:center;flex-wrap:wrap;z-index:20}
.bulk.on{display:flex}.bulk select{max-width:220px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0B0B0D;color:#fff;padding:10px 16px;border-radius:12px;z-index:300;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
code{background:#F1F4F9;border-radius:6px;padding:1px 5px;font-size:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){main{padding:10px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.tx .m{max-width:170px}}
</style>

<body>
<header><a href="/belso/"><img src="/caradvance-logo-white.webp" alt="CarAdvance"></a><b>Pénzügy</b><span class="sp"></span><span id="sys"></span><a href="/belso/">← Belső felület</a></header>
<main id="app"><div class="card">Betöltés…</div></main>
<script src="/belso/penzugy/kivonat.js?v=1"></script>
<script>
(function () {
'use strict';
var A = '/api/belso-penzugy/', app = document.getElementById('app');
var S = { tab: 'pl', meta: null, pnl: null, tx: [], docs: [], from: '', to: '', view: { lines: 'all', cols: 'months', basis: 'net', alloc: null, empty: false, collapsed: {} }, f: { q: '', st: 'all', cat: '', line: '', acc: '' }, sel: {} };
var KIND = { rev: 'Árbevétel', cogs: 'Közvetlen költség', opex: 'Működési költség', below: 'Adó / pénzügyi', excl: 'Nem eredményhatású' };
var MON = ['jan', 'feb', 'márc', 'ápr', 'máj', 'jún', 'júl', 'aug', 'szept', 'okt', 'nov', 'dec'];

/* ---------- segédek ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ft(n, dash) { n = Math.round(Number(n) || 0); if (!n && dash) return '–'; var s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n < 0 ? '−' : '') + s; }
function money(v, c) { var n = Number(v) || 0, d = c === 'HUF' ? 0 : 2; var s = Math.abs(n).toFixed(d).split('.'); return (n < 0 ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (s[1] ? ',' + s[1] : '') + ' ' + (c === 'HUF' ? 'Ft' : c); }
function nc(n) { return n < -0.5 ? 'neg' : n > 0.5 ? 'pos' : ''; }
function hd(d) { if (!d) return '—'; var p = String(d).slice(0, 10).split('-'); return p[0] + '.' + p[1] + '.' + p[2] + '.'; }
function mlabel(m) { var p = m.split('-'); return MON[Number(p[1]) - 1] + (p[0] !== String(new Date().getFullYear()) ? ' ' + p[0].slice(2) : ''); }
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function lastDay(ym) { var p = ym.split('-').map(Number); return ym + '-' + String(new Date(p[0], p[1], 0).getDate()).padStart(2, '0'); }
function toast(t, ms) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, ms || 2600); }
function api(p, data) {
  return fetch(A + p, { method: data ? 'POST' : 'GET', credentials: 'same-origin', headers: data ? { 'Content-Type': 'application/json' } : {}, body: data ? JSON.stringify(data) : undefined })
    .then(function (r) { return r.json().catch(function () { return { error: 'HTTP ' + r.status }; }).then(function (j) { j._s = r.status; return j; }); });
}
function must(j) { if (j.error) { toast('Hiba: ' + j.error, 5000); throw new Error(j.error); } return j; }
function catBy(id) { return S.meta.cats.filter(function (c) { return c.id === id; })[0]; }
function lineBy(id) { return S.meta.lines.filter(function (l) { return l.id === Number(id); })[0]; }
function parseSplit(s) { try { var a = JSON.parse(s || 'null'); return Array.isArray(a) ? a : null; } catch (e) { return null; } }
function txVat(t) { var c = t.cat_id ? catBy(t.cat_id) : null; return t.vat != null ? Number(t.vat) : (c ? Number(c.vat) || 0 : 0); }
function txNet(t) {
  var g = Number(t.amount_huf); if (t.amount_huf == null) return null;
  var v = txVat(t); if (!(v > 0)) return g;
  if (t.doc_gross != null && t.doc_net != null && Number(t.doc_gross)) { var r = Number(t.doc_net) / Number(t.doc_gross); if (r > 0.5 && r <= 1) return g * r; }
  return g / (1 + v / 100);
}
function txDocMode(t) { var c = t.cat_id ? catBy(t.cat_id) : null; return t.doc_mode || (c && c.doc_mode) || 'invoice'; }
function needsDoc(t) { var c = t.cat_id ? catBy(t.cat_id) : null; return !t.doc_id && txDocMode(t) !== 'none' && !(c && c.kind === 'excl'); }
function splitChips(s) {
  var a = parseSplit(s); if (!a) return '<span class="badge warn">nincs üzletág</span>';
  return a.map(function (x) { var l = lineBy(x.l); return l ? '<span class="chip"><span class="ldot" style="background:' + l.color + '"></span>' + esc(l.name) + (x.p !== 100 ? ' ' + x.p + '%' : '') + '</span>' : ''; }).join('');
}
function catOptions(sel, allowEmpty) {
  var h = allowEmpty ? '<option value="">— besorolásra vár —</option>' : '';
  ['rev', 'cogs', 'opex', 'below', 'excl'].forEach(function (k) {
    h += '<optgroup label="' + KIND[k] + '">' + S.meta.cats.filter(function (c) { return c.kind === k && (c.active || c.id === sel); }).map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</optgroup>';
  });
  return h;
}
function lineOptions(sel, first) { return (first || '') + S.meta.lines.filter(function (l) { return l.active || l.id === sel; }).map(function (l) { return '<option value="' + l.id + '"' + (l.id === sel ? ' selected' : '') + '>' + esc(l.name) + '</option>'; }).join(''); }
function modal(html, wide) {
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '"><button class="x" aria-label="Bezárás">✕</button>' + html + '</div>';
  bg.addEventListener('mousedown', function (e) { if (e.target === bg) bg.remove(); });
  $('.x', bg).onclick = function () { bg.remove(); };
  document.body.appendChild(bg); return bg;
}

/* ---------- betöltés ---------- */
function initPeriod() {
  var st = S.meta.stats || {}, y = new Date().getFullYear();
  var to = todayIso().slice(0, 7);
  var from = st.min && st.min.slice(0, 4) === String(y) ? st.min.slice(0, 7) : y + '-01';
  if (st.max && st.max.slice(0, 7) > to) to = st.max.slice(0, 7);
  S.from = from; S.to = to;
}
function boot() {
  api('meta').then(function (j) {
    if (j._s === 401) { app.innerHTML = '<div class="card"><h2>Nincs bejelentkezve</h2><p><a class="btn red" href="/belso/">Belépés a belső felületre</a></p></div>'; return; }
    if (j._s === 403) { app.innerHTML = '<div class="card"><h2>Nincs jogosultság</h2><p class="muted">A pénzügyi modul csak adminisztrátorok számára érhető el.</p></div>'; return; }
    must(j); S.meta = j; if (!S.view.alloc) S.view.alloc = (j.alloc && j.alloc.mode) || 'fixed';
    $('#sys').textContent = j.me.name || j.me.email;
    if (!S.from) initPeriod();
    return reload();
  }).catch(function (e) { app.innerHTML = '<div class="card note err">Betöltési hiba: ' + esc(e.message) + '</div>'; });
}
function reload() {
  var q = '?from=' + S.from + '-01&to=' + lastDay(S.to);
  return Promise.all([api('pnl' + q), api('tx' + q), api('docs' + q)]).then(function (r) {
    S.pnl = must(r[0]); S.tx = must(r[1]).tx; S.docs = must(r[2]).docs; render();
  });
}
function refreshMeta() { return api('meta').then(function (j) { S.meta = must(j); }); }

/* ---------- váz ---------- */
function render() {
  var unc = S.tx.filter(function (t) { return !t.cat_id; }).length;
  var nol = S.tx.filter(function (t) { var c = t.cat_id && catBy(t.cat_id); return !parseSplit(t.split) && !(c && c.kind === 'excl'); }).length;
  var miss = S.tx.filter(needsDoc).length;
  var presets = [['ytd', 'Idei év'], ['3m', 'Elmúlt 3 hónap'], ['12m', 'Elmúlt 12 hónap'], ['py', 'Előző év']];
  app.innerHTML = '<div class="row" style="margin:4px 0 2px">'
    + '<label class="small muted">Időszak</label><input class="in" type="month" id="pFrom" value="' + S.from + '"><span class="muted">–</span><input class="in" type="month" id="pTo" value="' + S.to + '">'
    + presets.map(function (p) { return '<button class="btn sm ghost" data-pre="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '<span class="sp"></span>'
    + '<span class="small muted">' + (S.meta.stats.n || 0) + ' tétel összesen · utolsó: ' + hd(S.meta.stats.max) + '</span></div>'
    + '<div class="tabs">'
    + tabBtn('pl', 'Eredménykimutatás') + tabBtn('tx', 'Tételek', unc + nol ? '<span class="cnt" title="besorolásra vár / üzletág nélkül">' + (unc + nol) + '</span>' : '')
    + tabBtn('docs', 'Bizonylatok', miss ? '<span class="cnt grey">' + miss + '</span>' : '') + tabBtn('imp', 'Import') + tabBtn('set', 'Beállítások') + '</div><div id="tab"></div>';
  $$('.tabs button').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.t; render(); }; });
  $('#pFrom').onchange = $('#pTo').onchange = function () { S.from = $('#pFrom').value || S.from; S.to = $('#pTo').value || S.to; if (S.from > S.to) S.to = S.from; reload(); };
  $$('[data-pre]').forEach(function (b) {
    b.onclick = function () {
      var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1, ym = function (yy, mm) { while (mm < 1) { mm += 12; yy--; } return yy + '-' + String(mm).padStart(2, '0'); };
      var p = b.dataset.pre;
      if (p === 'ytd') { S.from = y + '-01'; S.to = ym(y, m); } else if (p === '3m') { S.from = ym(y, m - 2); S.to = ym(y, m); }
      else if (p === '12m') { S.from = ym(y, m - 11); S.to = ym(y, m); } else { S.from = (y - 1) + '-01'; S.to = (y - 1) + '-12'; }
      reload();
    };
  });
  ({ pl: renderPL, tx: renderTx, docs: renderDocs, imp: renderImp, set: renderSet })[S.tab]();
}
function tabBtn(k, t, extra) { return '<button data-t="' + k + '" class="' + (S.tab === k ? 'on' : '') + '">' + t + (extra || '') + '</button>'; }

/* =================== EREDMÉNYKIMUTATÁS =================== */
function computePL() {
  var P = S.pnl, basis = S.view.basis === 'gross' ? 1 : 0, mode = S.view.alloc;
  var lines = S.meta.lines, shared = lines.filter(function (l) { return l.shared; }).map(function (l) { return String(l.id); });
  var key = (S.meta.alloc && S.meta.alloc.key) || {};
  var catK = {}; S.meta.cats.forEach(function (c) { catK[c.id] = c.kind; });
  // V[catKey][month][lineKey] = érték (a választott alap szerint)
  var V = {};
  Object.keys(P.cells).forEach(function (ck) { V[ck] = {}; Object.keys(P.cells[ck]).forEach(function (m) { V[ck][m] = {}; Object.keys(P.cells[ck][m]).forEach(function (l) { V[ck][m][l] = P.cells[ck][m][l][basis]; }); }); });
  if (mode !== 'none' && shared.length) {
    // havi árbevétel üzletáganként (árbevétel-arányos felosztáshoz)
    var rev = {};
    Object.keys(V).forEach(function (ck) { if (catK[ck] !== 'rev') return; Object.keys(V[ck]).forEach(function (m) { Object.keys(V[ck][m]).forEach(function (l) { if (shared.indexOf(l) !== -1 || l === 'NA') return; (rev[m] = rev[m] || {})[l] = (rev[m][l] || 0) + V[ck][m][l]; }); }); });
    Object.keys(V).forEach(function (ck) {
      if (catK[ck] === 'excl') return;
      Object.keys(V[ck]).forEach(function (m) {
        shared.forEach(function (sl) {
          var v = V[ck][m][sl]; if (!v) return;
          var w = {};
          if (mode === 'revenue' && rev[m]) { var tot = 0; Object.keys(rev[m]).forEach(function (l) { if (rev[m][l] > 0) { w[l] = rev[m][l]; tot += rev[m][l]; } }); if (tot > 0) Object.keys(w).forEach(function (l) { w[l] = w[l] / tot; }); else w = {}; }
          if (!Object.keys(w).length) Object.keys(key).forEach(function (l) { if (shared.indexOf(String(l)) === -1) w[l] = (Number(key[l]) || 0) / 100; });
          var used = 0;
          Object.keys(w).forEach(function (l) { if (!w[l]) return; V[ck][m][l] = (V[ck][m][l] || 0) + v * w[l]; used += w[l]; });
          V[ck][m][sl] = v * (1 - Math.min(1, used));
        });
      });
    });
  }
  return V;
}
function renderPL() {
  var P = S.pnl, V = computePL(), cats = S.meta.cats, lines = S.meta.lines;
  var selL = S.view.lines; // 'all' vagy lineId

        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.72).split(',')[1] });
      };
      img.onerror = rej; img.src = url; return;

  XLSXP = new Promise(function (res, rej) { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = function () { res(window.XLSX); }; s.onerror = function () { XLSXP = null; rej(new Error('Az XLS-olvasó nem töltődött be.')); }; document.head.appendChild(s); });
  return XLSXP;
}
var PENDING = [];
function renderImp() {
  document.getElementById('tab').innerHTML = '<div class="card"><h2>Banki kivonat importálása</h2>'
    + '<label class="drop" id="iz"><input type="file" id="iFile" multiple accept=".xls,.xlsx,.csv" style="display:none"><b>Húzd ide a bank exportját (XLS / XLSX / CSV)</b><br><span class="small">Több fájl is mehet egyszerre. A már importált tételeket a rendszer felismeri és kihagyja, így átfedő időszakot is nyugodtan feltölthetsz.</span></label>'
    + '<div id="iPrev"></div>'
    + '<p class="small muted">Támogatott: Raiffeisen „Könyvelt tételek” XLS (forint és deviza számla). A „Könyvelésre váró tételek” (zárolások) kimaradnak — a könyvelés után a következő exporttal jönnek be. Más bank CSV-je is működik, ha az oszlopnevek: <code>Típus, Könyvelés dátuma, Értéknap, Azonosító, Összeg, Közlemény/1…</code></p></div>'
    + '<div class="card"><h2>Számlák</h2><table><thead><tr><th>Név</th><th>Azonosító</th><th>Deviza</th><th>Cég</th><th class="n">Tételek</th><th>Utolsó tétel</th><th></th></tr></thead><tbody>'
    + S.meta.accounts.map(function (a) { return '<tr><td><input class="in" data-an="' + a.id + '" value="' + esc(a.name) + '"></td><td class="small muted">' + esc(a.ext_id) + '</td><td>' + a.currency + '</td><td><input class="in" data-ae="' + a.id + '" value="' + esc(a.entity || '') + '" placeholder="pl. cégnév / adószám"></td><td class="n">' + a.n + '</td><td class="small">' + hd(a.last) + '</td><td><button class="btn sm ghost" data-asv="' + a.id + '">Mentés</button></td></tr>'; }).join('')
    + '</tbody></table></div>';
  var iz = $('#iz');
  $('#iFile').onchange = function () { readImports(this.files); };
  iz.ondragover = function (e) { e.preventDefault(); iz.classList.add('over'); }; iz.ondragleave = function () { iz.classList.remove('over'); };
  iz.ondrop = function (e) { e.preventDefault(); iz.classList.remove('over'); readImports(e.dataTransfer.files); };
  $$('[data-asv]').forEach(function (b) { b.onclick = function () { var id = b.dataset.asv; api('accounts/' + id, { name: $('[data-an="' + id + '"]').value, entity: $('[data-ae="' + id + '"]').value }).then(must).then(function () { toast('Mentve'); refreshMeta(); }); }; });
  if (PENDING.length) showPending();
}
function readImports(files) {
  $('#iPrev').innerHTML = '<p>Feldolgozás…</p>';
  loadXlsx().then(function (X) {
    return Promise.all([].map.call(files, function (f) {
      return f.arrayBuffer().then(function (buf) {
        var wb = X.read(buf, { type: 'array', raw: true });
        return window.CAKivonat.parseWorkbook(X, wb).map(function (s) { s.file = f.name; if (wb.SheetNames.length === 1 && /^Sheet\d*$|^Munka\d*$/i.test(s.sheet)) s.ext_id = f.name.replace(/\.\w+$/, ''); return s; });
      });
    }));
  }).then(function (arr) { PENDING = [].concat.apply([], arr); showPending(); }).catch(function (e) { $('#iPrev').innerHTML = '<div class="note err">' + esc(e.message) + '</div>'; });
}
function showPending() {
  if (!PENDING.length) { $('#iPrev').innerHTML = '<div class="note warn">Nem találtam importálható „Könyvelt tételek” blokkot.</div>'; return; }
  $('#iPrev').innerHTML = PENDING.map(function (s, i) {
    var acc = S.meta.accounts.filter(function (a) { return a.ext_id === s.ext_id; })[0];
    return '<div class="card" style="background:#FAFBFD;box-shadow:none;border:1px solid var(--line)"><div class="row"><b>' + esc(s.file) + '</b><span class="muted small">munkalap: ' + esc(s.sheet) + '</span><span class="sp"></span>'
      + (acc ? '<span class="badge ok">ismert számla: ' + esc(acc.name) + ' (' + acc.currency + ')</span>' : '<span class="badge warn">új számla</span> <input class="in" data-pn="' + i + '" value="' + esc(s.ext_id) + '" style="width:220px"> <select class="in" data-pc="' + i + '">' + ['HUF', 'EUR', 'USD', 'GBP', 'CZK', 'PLN'].map(function (c) { return '<option' + (c === s.currency ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>') + '</div>'
      + '<div class="small" style="margin:6px 0">' + s.rows.length + ' könyvelt tétel' + (s.pending ? ' · ' + s.pending + ' zárolás kihagyva' : '') + '</div>'
      + '<button class="btn red sm" data-go="' + i + '"' + (s.rows.length ? '' : ' disabled') + '>Importálás</button> <span class="small" id="ir' + i + '"></span></div>';
  }).join('') + (PENDING.length > 1 ? '<button class="btn navy" id="goAll">Mind importálása</button>' : '');
  function go(i) {
    var s = PENDING[i]; if (!s || s.done) return Promise.resolve();
    var acc = { ext_id: s.ext_id, name: $('[data-pn="' + i + '"]') ? $('[data-pn="' + i + '"]').value : s.ext_id, currency: $('[data-pc="' + i + '"]') ? $('[data-pc="' + i + '"]').value : s.currency };
    $('#ir' + i).textContent = 'Importálás…';
    return api('import', { account: acc, rows: s.rows }).then(must).then(function (j) {
      s.done = 1; $('#ir' + i).innerHTML = '✓ <b>' + j.inserted + ' új</b>, ' + j.skipped + ' már megvolt' + (j.fxMissing ? ', ' + j.fxMissing + ' árfolyam nélkül' : '') + (j.matched ? ', ' + j.matched + ' bizonylat párosítva' : '');
      var b = $('[data-go="' + i + '"]'); if (b) b.disabled = true;
    });
  }
  $$('[data-go]').forEach(function (b) { b.onclick = function () { go(Number(b.dataset.go)).then(after); }; });
  if ($('#goAll')) $('#goAll').onclick = function () { var p = Promise.resolve(); PENDING.forEach(function (_, i) { p = p.then(function () { return go(i); }); }); p.then(after); };
  function after() { if (PENDING.every(function (s) { return s.done; })) { PENDING = []; toast('Import kész'); refreshMeta().then(function () { initPeriod(); return reload(); }); } }
}

/* =================== BEÁLLÍTÁSOK =================== */
function renderSet() {
  var al = S.meta.alloc || { mode: 'fixed', key: {} };
  var ruleCat = function (r) { var c = r.cat_id && catBy(r.cat_id); return c ? esc(c.name) : '<span class="muted">—</span>'; };
  document.getElementById('tab').innerHTML =
    '<div class="card"><h2>Közös költségek felosztása</h2><p class="small muted" style="margin-top:0">A „' + esc((S.meta.lines.filter(function (l) { return l.shared; })[0] || {}).name || 'Közös') + '” üzletágra sorolt tételek (bankdíj, könyvelés, szoftver, TAO…) a kimutatásban így terhelődnek rá a többi üzletágra. Árbevétel-arányos módban havonta a tényleges árbevétel arányában; ha egy hónapban nincs árbevétel, a fix kulcs érvényes.</p>'
    + '<div class="row"><label><input type="radio" name="am" value="fixed"' + (al.mode === 'fixed' ? ' checked' : '') + '> fix kulcs</label><label><input type="radio" name="am" value="revenue"' + (al.mode === 'revenue' ? ' checked' : '') + '> árbevétel-arányos</label><label><input type="radio" name="am" value="none"' + (al.mode === 'none' ? ' checked' : '') + '> nincs felosztás</label></div>'
    + '<div class="split" style="margin-top:10px">' + S.meta.lines.filter(function (l) { return !l.shared && l.active; }).map(function (l) { return '<label><span class="ldot" style="background:' + l.color + '"></span><span style="flex:1">' + esc(l.name) + '</span><input type="number" min="0" max="100" data-k="' + l.id + '" value="' + (al.key[l.id] || '') + '">%</label>'; }).join('') + '</div>'
    + '<div class="row" style="margin-top:10px"><button class="btn red sm" id="alSave">Mentés</button><span class="small muted">Fix kulcsnál a 100%-ból hiányzó rész a közös soron marad.</span></div></div>'
    + '<div class="card"><div class="row"><h2 style="margin:0">Besorolási szabályok</h2><span class="sp"></span><button class="btn sm ghost" id="rRun">Szabályok újrafuttatása</button><button class="btn sm red" id="rNew">+ Új szabály</button></div>'
    + '<p class="small muted">Sorrend: a kisebb prioritás nyer. A minta reguláris kifejezés a tétel <code>TÍPUS | PARTNER | KÖZLEMÉNY | SZÁMLASZÁM</code> szövegén (ékezet nélkül, nagybetűvel). A kézzel besorolt tételeket a szabályok nem írják felül.</p>'
    + '<div style="overflow:auto"><table class="tx"><thead><tr><th>Prio</th><th>Név</th><th>Minta</th><th>Irány</th><th>Kategória</th><th>Üzletág</th><th class="n">Találat</th></tr></thead><tbody>'
    + S.meta.rules.map(function (r) { return '<tr data-rule="' + r.id + '"' + (r.active ? '' : ' style="opacity:.45"') + '><td>' + r.prio + '</td><td>' + esc(r.name) + '</td><td><code>' + esc(r.pattern.length > 60 ? r.pattern.slice(0, 60) + '…' : r.pattern) + '</code></td><td class="small">' + ({ in: 'jóváírás', out: 'terhelés', any: 'mindkettő' }[r.dir] || '') + '</td><td class="small">' + ruleCat(r) + '</td><td>' + (r.split ? splitChips(r.split) : '<span class="muted small">—</span>') + '</td><td class="n">' + (r.hits || 0) + '</td></tr>'; }).join('')
    + '</tbody></table></div></div>'
    + '<div class="card"><div class="row"><h2 style="margin:0">Üzletágak</h2><span class="sp"></span><button class="btn sm red" id="lNew">+ Új üzletág</button></div><table style="margin-top:8px"><thead><tr><th>Név</th><th>Szín</th><th>Közös (felosztandó)</th><th>Sorrend</th><th>Aktív</th><th></th></tr></thead><tbody>'
    + S.meta.lines.map(function (l) { return '<tr data-line="' + l.id + '"><td><input class="in" data-f="name" value="' + esc(l.name) + '"></td><td><input type="color" data-f="color" value="' + l.color + '"></td><td><input type="checkbox" data-f="shared"' + (l.shared ? ' checked' : '') + '></td><td><input class="in" data-f="sort" type="number" style="width:80px" value="' + l.sort + '"></td><td><input type="checkbox" data-f="active"' + (l.active ? ' checked' : '') + '></td><td><button class="btn sm ghost" data-lsv>Mentés</button></td></tr>'; }).join('')
    + '</tbody></table></div>'
    + '<div class="card"><div class="row"><h2 style="margin:0">Kategóriák</h2><span class="sp"></span><button class="btn sm red" id="cNew">+ Új kategória</button></div><p class="small muted">ÁFA-kulcs = a bruttó összegben lévő levonható (költség) / fizetendő (bevétel) ÁFA. 0% = a bruttó a költség: személyautó üzemanyaga és bérlése, külföldi fordított adózású szolgáltatás, alanyi adómentes vállalkozó, magánszemély bérbeadó.</p><div style="overflow:auto"><table><thead><tr><th>Név</th><th>Típus</th><th>Csoport</th><th>ÁFA</th><th>Bizonylat</th><th>Sorrend</th><th>Aktív</th><th></th></tr></thead><tbody>'
    + S.meta.cats.map(function (c) { return catRowHtml(c); }).join('') + '</tbody></table></div></div>';
  $('#alSave').onclick = function () { var key = {}; $$('[data-k]').forEach(function (i) { if (Number(i.value) > 0) key[i.dataset.k] = Number(i.value); }); var mode = ($('[name=am]:checked') || {}).value || 'fixed'; api('alloc', { mode: mode, key: key }).then(must).then(function () { S.view.alloc = mode; toast('Felosztás mentve'); refreshMeta().then(reload); }); };
  $('#rRun').onclick = function () { api('rules/run', {}).then(must).then(function (j) { toast(j.changed + ' tétel átsorolva, ' + j.matched + ' párosítás'); refreshMeta().then(reload); }); };
  $('#rNew').onclick = function () { editRule(null); };
  $$('[data-rule]').forEach(function (tr) { tr.onclick = function () { editRule(S.meta.rules.filter(function (r) { return r.id === Number(tr.dataset.rule); })[0]); }; });
  $('#lNew').onclick = function () { var n = prompt('Új üzletág neve:'); if (n) api('lines', { name: n, color: '#2554B8', sort: 60 }).then(must).then(function () { refreshMeta().then(render); }); };
  $$('[data-lsv]').forEach(function (b) { b.onclick = function () { var tr = b.closest('tr'), g = function (f) { return $('[data-f="' + f + '"]', tr); }; api('lines', { id: Number(tr.dataset.line), name: g('name').value, color: g('color').value, shared: g('shared').checked, sort: Number(g('sort').value), active: g('active').checked }).then(must).then(function () { toast('Mentve'); refreshMeta().then(render); }); }; });
  $('#cNew').onclick = function () { var n = prompt('Új kategória neve:'); if (n) api('cats', { name: n, kind: 'opex', grp: 'Iroda és működés', vat: 27, sort: 500 }).then(must).then(function () { refreshMeta().then(render); }); };
  $$('[data-csv]').forEach(function (b) { b.onclick = function () { var tr = b.closest('tr'), g = function (f) { return $('[data-f="' + f + '"]', tr); }; api('cats', { id: Number(tr.dataset.cat), name: g('name').value, kind: g('kind').value, grp: g('grp').value, vat: Number(g('vat').value), doc_mode: g('doc').value, sort: Number(g('sort').value), active: g('active').checked }).then(must).then(function () { toast('Mentve'); refreshMeta().then(render); }); }; });
}
function catRowHtml(c) {
  return '<tr data-cat="' + c.id + '"><td><input class="in" data-f="name" value="' + esc(c.name) + '" style="min-width:200px"></td><td><select class="in" data-f="kind">' + Object.keys(KIND).map(function (k) { return '<option value="' + k + '"' + (k === c.kind ? ' selected' : '') + '>' + KIND[k] + '</option>'; }).join('') + '</select></td>'
    + '<td><input class="in" data-f="grp" value="' + esc(c.grp) + '"></td><td><select class="in" data-f="vat">' + [0, 5, 18, 27].map(function (v) { return '<option' + (v === c.vat ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select></td>'
    + '<td><select class="in" data-f="doc"><option value="invoice">kell</option><option value="none"' + (c.doc_mode === 'none' ? ' selected' : '') + '>nem kell</option></select></td><td><input class="in" type="number" data-f="sort" value="' + c.sort + '" style="width:76px"></td><td><input type="checkbox" data-f="active"' + (c.active ? ' checked' : '') + '></td><td><button class="btn sm ghost" data-csv>Mentés</button></td></tr>';
}
function editRule(r) {
  r = r || { id: null, prio: 5, name: '', pattern: '', dir: 'out', cat_id: null, split: null, vat: null, doc_mode: null, active: 1 };
  var m = modal('<h2>' + (r.id ? 'Szabály szerkesztése' : 'Új szabály') + '</h2>'
    + '<div class="grid"><label class="f" style="grid-column:span 2">Név<input class="in" id="rName" value="' + esc(r.name) + '"></label><label class="f">Prioritás (kisebb = előbb)<input class="in" type="number" id="rPrio" value="' + r.prio + '"></label>'
    + '<label class="f full">Minta (regex, pl. <code>SHELL|MOL</code>)<input class="in" id="rPat" value="' + esc(r.pattern) + '"></label>'
    + '<label class="f">Irány<select class="in" id="rDir"><option value="out"' + (r.dir === 'out' ? ' selected' : '') + '>terhelés</option><option value="in"' + (r.dir === 'in' ? ' selected' : '') + '>jóváírás</option><option value="any"' + (r.dir === 'any' ? ' selected' : '') + '>mindkettő</option></select></label>'
    + '<label class="f" style="grid-column:span 2">Kategória<select class="in" id="rCat">' + catOptions(r.cat_id, true).replace('— besorolásra vár —', '— nem állít kategóriát —') + '</select></label>'
    + '<label class="f">ÁFA-kulcs<select class="in" id="rVat"><option value="">kategória szerint</option>' + [0, 5, 18, 27].map(function (v) { return '<option value="' + v + '"' + (r.vat === v ? ' selected' : '') + '>' + v + '%</option>'; }).join('') + '</select></label>'
    + '<label class="f">Bizonylat<select class="in" id="rDoc"><option value="">kategória szerint</option><option value="invoice"' + (r.doc_mode === 'invoice' ? ' selected' : '') + '>kell</option><option value="none"' + (r.doc_mode === 'none' ? ' selected' : '') + '>nem kell</option></select></label>'
    + '<label class="f"><br><input type="checkbox" id="rAct"' + (r.active ? ' checked' : '') + '> aktív</label></div>'
    + '<h3>Üzletág</h3>' + splitEditor(r.split)
    + '<div class="row" style="margin-top:12px"><button class="btn ghost sm" id="rTest">Próba a meglévő tételeken</button><span class="small" id="rTestR"></span></div><div id="rTestL"></div>'
    + '<div class="row" style="margin-top:16px"><button class="btn red" id="rSave">Mentés és futtatás</button>' + (r.id ? '<button class="btn ghost" id="rDel">Törlés</button>' : '') + '</div>');
  bindSplit(m);
  $('#rTest', m).onclick = function () { api('rules-test', { pattern: $('#rPat', m).value, dir: $('#rDir', m).value }).then(must).then(function (j) { $('#rTestR', m).textContent = j.n + ' tétel illeszkedik'; $('#rTestL', m).innerHTML = j.sample.map(function (t) { return '<div class="small">' + hd(t.bdate) + ' · ' + esc(t.partner) + ' · ' + money(t.amount, t.currency) + '</div>'; }).join(''); }); };
  $('#rSave', m).onclick = function () { api('rules', { id: r.id, name: $('#rName', m).value, prio: Number($('#rPrio', m).value), pattern: $('#rPat', m).value, dir: $('#rDir', m).value, cat_id: Number($('#rCat', m).value) || null, vat: $('#rVat', m).value === '' ? null : Number($('#rVat', m).value), doc_mode: $('#rDoc', m).value || null, split: readSplit(m), active: $('#rAct', m).checked }).then(must).then(function (j) { m.remove(); toast('Szabály mentve, ' + j.changed + ' tétel átsorolva'); refreshMeta().then(reload); }); };
  if ($('#rDel', m)) $('#rDel', m).onclick = function () { if (confirm('Törlöd a szabályt? (A már besorolt tételek a következő futtatásig maradnak.)')) api('rules/' + r.id + '/delete', {}).then(must).then(function () { m.remove(); refreshMeta().then(render); }); };
}

boot();
})();
