<style>
:root{--red:#E2001A;--red2:#B80015;--ink:#0F172A;--ink2:#334155;--mut:#5A6B82;--line:#E6EAF1;--bg:#F4F5F7;--ok:#15803D;--okbg:#DCFCE7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{background:#0B0B0D;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.top img{height:34px;display:block}.top span{color:#cbd2dc;font-size:12.5px;display:flex;align-items:center;gap:6px}
.hero{background:radial-gradient(900px 300px at 85% -40%,rgba(226,0,26,.45),transparent 60%),linear-gradient(180deg,#0B0B0D,#151821);color:#fff;padding:26px 20px 70px}
.hero h1{margin:0 0 4px;font-size:25px;line-height:1.2}.hero p{margin:0;color:#c9cfda}
.wrap{max-width:1000px;margin:-48px auto 40px;padding:0 14px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:10px}
.card h2 .n{width:28px;height:28px;border-radius:9px;background:#fdeceb;color:var(--red);font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.card.off{opacity:.55;pointer-events:none}
.muted{color:var(--mut)}.small{font-size:13px}
.doc{border:1.5px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.doc .h{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.doc .h b{flex:1;min-width:180px;font-size:14.5px}
.doc.ok{border-color:#bfe8cd;background:#f8fdf9}
.pv{border-top:1px solid var(--line);padding:16px 18px;max-height:520px;overflow:auto;font-size:12.5px;line-height:1.55;background:#fff;display:none}
.doc.open .pv{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:700 15px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red2)}.btn.dark{background:#0F172A;color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--red);flex:none}
.in{width:100%;margin-top:4px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#F7F9FC;font:inherit;color:var(--ink)}
.in:focus{outline:none;border-color:#22447d;background:#fff}
.code{font:700 26px/1 "Courier New",monospace;letter-spacing:8px;text-align:center;max-width:240px;display:block}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-top:10px}
.pad{position:relative;border:1.5px dashed #c8ced8;border-radius:16px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:200px;border-radius:16px;cursor:crosshair}
.pad .ln{position:absolute;left:24px;right:24px;bottom:44px;border-top:1px solid #d6dae1;pointer-events:none}
.pad .ph{position:absolute;left:0;right:0;top:44%;text-align:center;color:#a3abb8;pointer-events:none;font-size:14px}
.note{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px;background:#EEF4FF;color:#1e3a8a}
.note.err{background:#FDE8EB;color:#9f1239}.note.ok{background:var(--okbg);color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:flex-start;margin-top:14px}
.big{font-size:44px;line-height:1;margin-bottom:6px}
@media(max-width:560px){.card{padding:18px}.hero h1{font-size:21px}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 13.5px inherit;font-family:inherit;cursor:pointer;color:var(--ink2)}
.tabs button.on{background:#0F172A;color:#fff;border-color:#0F172A}
.req{border:1.5px solid var(--line);border-radius:14px;margin:10px 0;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.req.sel{border-color:#f3a3ad;background:#fff7f8}.req .main{flex:1;min-width:0}.req .t{font-weight:700}
.req ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}.req li{margin:3px 0}
.lnk{background:none;border:0;color:#1d4ed8;cursor:pointer;font:inherit;font-size:12.5px;padding:0 0 0 6px;text-decoration:underline}
.bar{position:sticky;bottom:10px;background:#0F172A;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.bar .sp{flex:1}.sigimg{max-width:320px;max-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:6px;background:#fff;display:block}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:#fff4e5;color:#9a5b00}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.off{background:#eef0f4;color:var(--mut)}
.mdl{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.mdl .card{max-width:520px;width:100%;margin:0}
.topr{display:flex;gap:10px;align-items:center}.topr select{background:#1b1f2a;color:#cbd2dc;border:1px solid #333a48;border-radius:8px;padding:4px 6px;font:inherit;font-size:12.5px}
.topr button{background:none;border:1px solid #333a48;color:#cbd2dc;border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}

/* vertragsarten, ältere vorgänge, pdf-ansicht */
.req{border-left-width:5px}.req.c-mietkauf{border-left-color:#7c3aed}.req.c-import{border-left-color:#d97706}.req.c-miete{border-left-color:#2563eb}.req.c-other{border-left-color:#94a3b8}
.cbadge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:1px}
.cbadge.c-mietkauf{background:#f1eafe;color:#6d28d9}.cbadge.c-import{background:#fff3df;color:#a2560b}.cbadge.c-miete{background:#e8f0fe;color:#1d4ed8}.cbadge.c-other{background:#eef0f4;color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.cats button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.cats button b{display:block;font-size:14px}.cats button small{color:var(--mut);font-size:12px}
.cats button.on{border-color:#0F172A;box-shadow:0 0 0 2px #0F172A inset}
.cats button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.cats .n{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:6px}
.grp{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:15px;font-weight:800}.grp .ln2{flex:1;height:1px;background:var(--line)}
.dl{list-style:none;margin:8px 0 0;padding:0}.dl li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:#fff;font-size:14px}
.dl li .nm{flex:1;min-width:160px;font-weight:600}.dl li .nm small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.vbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#0F172A;color:#fff;font:700 13px/1 inherit;font-family:inherit;padding:9px 14px;cursor:pointer}.vbtn:hover{background:#1e293b}
.req.old{opacity:.6;padding:8px 12px;background:#fafbfc}.req.old:hover{opacity:1}.req.old .dl li{padding:4px 8px;font-size:13px}.req.old .vbtn{padding:6px 10px;font-size:12px;background:#475569}
details.older{margin-top:18px}details.older>summary{cursor:pointer;font-weight:700;color:var(--mut);font-size:14px;padding:8px 0}
.viewer{position:fixed;inset:0;background:rgba(15,23,42,.8);z-index:60;display:flex;flex-direction:column;padding:12px}
.viewer .vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff;padding:4px 4px 10px}.viewer .vh b{flex:1;min-width:180px;font-size:15px}
.viewer .vh a,.viewer .vh button{background:#fff;color:#0F172A;border:0;border-radius:999px;padding:8px 14px;font:700 13px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.viewer .vh button.x{background:var(--red);color:#fff}
.viewer iframe{flex:1;width:100%;border:0;border-radius:12px;background:#fff}
.viewer .pages{flex:1;overflow:auto;border-radius:12px;background:#525659;padding:14px 8px;text-align:center}
.viewer .pages canvas{display:block;margin:0 auto 14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:none}
.viewer .vh .zm{background:#1e293b;color:#fff;min-width:38px}
/* a buildfolyamat által beszúrt webhely-fejléc / -lábléc elrejtése: ez az oldal önálló */
body>*:not(.top):not(.hero):not(.wrap):not(.mdl):not(.viewer):not(script):not(style){display:none!important}

  err:{bad_login:'Hibás felhasználónév vagy jelszó.',locked:'Túl sok hibás próbálkozás — a fiók 15 percre zárolva.',rate:'Túl sok kérés — várjon néhány percet.',auth:'Jelentkezzen be újra.',bad_old:'A jelenlegi jelszó hibás.',weak:'Az új jelszó túl gyenge (min. 10 karakter, nem a kezdő jelszó).',bad_name:'Adja meg a nevet.',bad_signature:'Írjon alá a keretben.',no_sig:'Előbb mentse el az aláírását.',none:'Jelöljön ki legalább egy kérelmet.',too_many_codes:'Túl sok kódkérés — próbálja újra egy óra múlva.',mail_failed:'A kódot nem sikerült elküldeni.',consent:'Fogadja el a nyilatkozatot.',code_expired:'A kód lejárt — kérjen újat.',too_many:'Túl sok hibás próbálkozás — kérjen új kódot.',wrong_code:'Hibás kód.',must_change:'Előbb változtassa meg a jelszavát.',server:'Váratlan hiba — próbálja újra.'}}
};
function L(){return I18N[LANG]||I18N.de;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function post(p,body,raw){
  return fetch(A+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{}),credentials:'same-origin',cache:'no-store'}).then(function(r){
    if(raw&&r.ok)return r;
    return r.json().catch(function(){return {ok:false,error:'server'};}).then(function(j){if(!j.ok){var e=new Error(L().err[j.error]||j.error||'Error');e.code=j.error;e.left=j.left;if(j.error==='auth'){ME=null;renderLogin();}throw e;}return j;});
  });
}
try{var sl=localStorage.getItem('ca_partner_lang');if(I18N[sl])LANG=sl;}catch(e){}

function head(){document.documentElement.lang=LANG;$('h1').textContent=L().portal;document.title=L().portal+' — CarAdvance';$('sub').textContent=ME?L().sub(ME):'';$('out').style.display=ME?'':'none';$('out').textContent=L().logout;}
function note(id,msg,kind){var el=$(id);if(el)el.innerHTML=msg?'<div class="note'+(kind?' '+kind:' err')+'">'+esc(msg)+'</div>':'';}

    +'<label class="f">'+L().user+'<input class="in" id="lu" autocomplete="username" inputmode="email"></label>'

function renderPw(forced){

    +'<label class="f">'+L().oldPw+'<input class="in" id="po" type="password" autocomplete="current-password"></label>'

function loadList(){return post('/list').then(function(j){REQ=j.requests||[];SEL={};if(ME&&!ME.must_change)renderMain();}).catch(function(){});}
function inMk(r){return (!MKT||r.market===MKT)&&(!CAT||r.cat===CAT);}
function isOld(r){if(r.status==='pending')return false;if(r.status!=='signed')return true;return r.signed_ts&&(Date.now()-r.signed_ts)>OLD_DAYS*864e5;}
function count(st){return REQ.filter(function(r){return inMk(r)&&(st==='open'?r.status==='pending':st==='done'?r.status==='signed':true);}).length;}
function renderMain(){
  head();
  var tabs=[['open',L().tOpen+' ('+count('open')+')'],['done',L().tDone+' ('+count('done')+')'],['all',L().tAll],['sig',L().tSig+(ME.has_sig?' ✓':'')],['pw',L().tPw]];
  app.innerHTML='<div class="card"><div class="tabs">'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+esc(t[1])+'</button>';}).join('')+'</div><div id="pane"></div></div>';
  app.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){TAB=b.getAttribute('data-tab');renderMain();});});
  if(TAB==='sig')return renderSig();

function stBadge(s){var cls=s==='signed'?'ok':s==='pending'?'':'off';return '<span class="badge '+cls+'">'+esc(L().st[s]||s)+'</span>';}
function renderList(){
  var inTab=function(r){return TAB==='open'?r.status==='pending':TAB==='done'?r.status==='signed':true;};
  var list=REQ.filter(function(r){return inMk(r)&&inTab(r);});
  var h='';
  // szerződéstípus: Mietkauf (Eladás) / Import / Miete (Bérlés)
  var present=CATS.filter(function(c){return c!=='other'||REQ.some(function(r){return r.cat===c;});});
  {
    var cnt=function(c){return REQ.filter(function(r){return (!MKT||r.market===MKT)&&(!c||r.cat===c)&&inTab(r);}).length;};
    var pend=function(c){return REQ.filter(function(r){return (!MKT||r.market===MKT)&&(!c||r.cat===c)&&r.status==='pending';}).length;};
    h+='<div class="cats"><button data-cat="" class="'+(CAT?'':'on')+'"><b>'+esc(L().allCat)+(pend('')?'<span class="n">'+pend('')+'</span>':'')+'</b><small>'+cnt('')+' '+esc(L().total)+'</small></button>'
      +present.map(function(c){var p=pend(c);return '<button data-cat="'+c+'" class="'+(CAT===c?'on':'')+'"><b><span class="dot" style="background:'+CCOL[c]+'"></span>'+esc(L().cats[c])+(p?'<span class="n" title="'+esc(L().toSign)+'">'+p+'</span>':'')+'</b><small>'+cnt(c)+' '+esc(L().total)+'</small></button>';}).join('')+'</div>';
  }
  // származási ország (piac) szerinti szűrés: HU, PL, SK, CZ, RO …
  var mks=[];REQ.forEach(function(r){if(mks.indexOf(r.market)<0)mks.push(r.market);});mks.sort();
  if(mks.length>1||MKT)h+='<div class="tabs" style="margin-top:-4px"><span class="small muted" style="align-self:center">'+esc(L().mk)+':</span><button data-mk="" class="'+(MKT?'':'on')+'">'+esc(L().allMk)+'</button>'+mks.map(function(m){var n=REQ.filter(function(r){return r.market===m&&r.status==='pending';}).length;return '<button data-mk="'+esc(m)+'" class="'+(MKT===m?'on':'')+'">'+(FLAG[m]||'')+' '+esc(m)+(n?' ('+n+')':'')+'</button>';}).join('')+'</div>';
  if(TAB!=='done'&&!ME.has_sig)h+='<div class="note">'+esc(L().needSig)+'</div>';
  if(!list.length)h+='<p class="muted">'+(TAB==='done'?L().noDone:L().noOpen)+'</p>';
  var openN=list.filter(function(r){return r.status==='pending';}).length;
  if(openN)h+='<label class="chk"><input type="checkbox" id="sa"> '+L().selAll+'</label>';
  var card=function(r){
    var open=r.status==='pending',old=isOld(r);
    return '<div class="req c-'+r.cat+(SEL[r.id]?' sel':'')+(old?' old':'')+'">'+(open?'<input type="checkbox" data-s="'+r.id+'"'+(SEL[r.id]?' checked':'')+' style="width:20px;height:20px;accent-color:var(--red);margin-top:2px">':'')
      +'<div class="main"><div class="t"><span title="'+esc(L().mk)+'">'+(FLAG[r.market]||'')+' '+esc(r.market||'')+'</span> · '+esc(L().client)+': '+esc(r.client||'—')+' '+stBadge(r.status)+'<span class="cbadge c-'+r.cat+'">'+esc(L().cats[r.cat]||'')+'</span></div>'
      +'<div class="small muted">#'+r.id+' · '+L().received+': '+esc(r.received)+(r.client_signed?' · '+L().clientSigned+': '+esc(r.client_signed):'')+(r.signed_at?' · '+L().signedAt+': '+esc(r.signed_at)+(r.sign_name?' ('+esc(r.sign_name)+')':''):'')+'</div>'
      +'<ul class="dl">'+r.docs.map(function(d){return '<li><span class="nm">📄 '+esc(d.name)+(d.number?'<small>'+esc(d.number)+'</small>':'')+'</span><button class="vbtn" data-pdf="'+r.id+':'+d.i+'" data-nm="'+esc(d.name)+'">👁 '+esc(L().view)+'</button></li>';}).join('')+'</ul></div></div>';
  };
  var fresh=list.filter(function(r){return !isOld(r);}),older=list.filter(isOld);
  var group=function(arr){
    if(CAT||!arr.length)return arr.map(card).join('');
    return CATS.map(function(c){var g=arr.filter(function(r){return r.cat===c;});return g.length?'<div class="grp"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:'+CCOL[c]+'"></span>'+esc(L().cats[c])+' <span class="muted small">('+g.length+')</span><span class="ln2"></span></div>'+g.map(card).join(''):'';}).join('');
  };
  h+=group(fresh);
  if(older.length)h+='<details class="older"'+(fresh.length?'':' open')+'><summary>'+esc(L().older(older.length))+'</summary>'+older.map(card).join('')+'</details>';
  if(openN)h+='<div class="bar"><span id="selc">'+esc(L().selected(Object.keys(SEL).filter(function(k){return SEL[k];}).length))+'</span><span class="sp"></span><button class="btn red" id="sgo">'+L().signSel+'</button></div><div class="sec">🔒 <span>'+esc(L().sec)+'</span></div>';
  $('pane').innerHTML=h;
  $('pane').querySelectorAll('[data-s]').forEach(function(c){c.addEventListener('change',function(){SEL[c.getAttribute('data-s')]=c.checked;c.closest('.req').classList.toggle('sel',c.checked);upd();});});
  var sa=$('sa');if(sa)sa.addEventListener('change',function(){var on=sa.checked;$('pane').querySelectorAll('[data-s]').forEach(function(c){c.checked=on;SEL[c.getAttribute('data-s')]=on;c.closest('.req').classList.toggle('sel',on);});upd();});
  $('pane').querySelectorAll('[data-mk]').forEach(function(b){b.addEventListener('click',function(){MKT=b.getAttribute('data-mk');SEL={};renderMain();});});
  $('pane').querySelectorAll('[data-cat]').forEach(function(b){b.addEventListener('click',function(){CAT=b.getAttribute('data-cat');SEL={};renderMain();});});
  $('pane').querySelectorAll('[data-pdf]').forEach(function(b){b.addEventListener('click',function(){var x=b.getAttribute('data-pdf').split(':');viewPdf(+x[0],+x[1],b.getAttribute('data-nm'));});});
  var g=$('sgo');if(g){g.addEventListener('click',startSign);upd();}
  function upd(){var n=Object.keys(SEL).filter(function(k){return SEL[k];}).length;var s=$('selc');if(s)s.textContent=L().selected(n);if(g)g.disabled=!n;}
}
// nagy PDF-nézet az oldalon belül: az oldalak pdf.js-sel, a képernyő szélességére nagyítva (mobilon is olvasható); ha nem megy, beépített nézet
var __pdfjs=null;
function pdfjs(){
  if(__pdfjs)return __pdfjs;
  __pdfjs=new Promise(function(res,rej){var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);}catch(e){rej(e);}};sc.onerror=function(){__pdfjs=null;rej(new Error('pdfjs'));};document.head.appendChild(sc);});
  return __pdfjs;
}
function viewPdf(id,i,name){
  var ov=document.createElement('div');ov.className='viewer';
  ov.innerHTML='<div class="vh"><b>'+esc(name||'PDF')+'</b><span id="vst" style="color:#cbd2dc;font-size:13px">'+esc(L().loading)+'</span></div><div class="pages" id="vpg"></div>';
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  var url=null,doc=null,zoom=1,close=function(){ov.remove();document.body.style.overflow='';if(url)setTimeout(function(){URL.revokeObjectURL(url);},60000);document.removeEventListener('keydown',esck);};
  var esck=function(e){if(e.key==='Escape')close();};document.addEventListener('keydown',esck);
  var hd=ov.querySelector('.vh'),box=ov.querySelector('#vpg');
  var btn=function(txt,cls,fn){var x=document.createElement('button');x.textContent=txt;if(cls)x.className=cls;x.addEventListener('click',fn);return x;};
  var x=btn('✕ '+L().close,'x',close);hd.appendChild(x);
  var draw=function(){
    if(!doc)return;box.innerHTML='';
    var W=Math.min(box.clientWidth-16,1100)*zoom,dpr=Math.min(window.devicePixelRatio||1,2),ch=Promise.resolve();
    for(var n=1;n<=doc.numPages;n++)(function(n){ch=ch.then(function(){return doc.getPage(n).then(function(pg){
      var v1=pg.getViewport({scale:1}),sc=W/v1.width,vp=pg.getViewport({scale:sc*dpr}),cv=document.createElement('canvas');
      cv.width=vp.width;cv.height=vp.height;cv.style.width=Math.round(vp.width/dpr)+'px';cv.style.height=Math.round(vp.height/dpr)+'px';box.appendChild(cv);
      return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;});});})(n);
    return ch;
  };
  post('/pdf',{id:id,i:i},true).then(function(r){return r.arrayBuffer();}).then(function(buf){
    url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
    var fn=String(name||'dokument').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_.-]+/g,'_').slice(0,70)+'.pdf';
    var o=document.createElement('a');o.href=url;o.target='_blank';o.rel='noopener';o.textContent='↗ '+L().openTab;
    var dl=document.createElement('a');dl.href=url;dl.download=fn;dl.textContent='↓ '+L().download;
    var zm=btn('−','zm',function(){zoom=Math.max(.5,zoom-.25);draw();}),zp=btn('+','zm',function(){zoom=Math.min(3,zoom+.25);draw();});
    hd.insertBefore(zm,x);hd.insertBefore(zp,x);hd.insertBefore(o,x);hd.insertBefore(dl,x);
    return pdfjs().then(function(lib){return lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;}).then(function(d){doc=d;var st=$('vst');if(st)st.remove();return draw();})
      .catch(function(){ // tartalék: a böngésző beépített PDF-nézője
        zm.remove();zp.remove();var st=$('vst');if(st)st.remove();
        box.outerHTML='<iframe title="PDF" src="'+url+'#view=FitH"></iframe>';
      });
  }).catch(function(e){close();alert(e.message);});
}
function openPdf(id,i){
  var w=window.open('','_blank');
  post('/pdf',{id:id,i:i},true).then(function(r){return r.blob();}).then(function(b){var u=URL.createObjectURL(b);if(w)w.location.href=u;else location.href=u;}).catch(function(e){if(w)w.close();alert(e.message);});
}
function startSign(){
  var ids=Object.keys(SEL).filter(function(k){return SEL[k];}).map(Number);if(!ids.length)return;
  if(!ME.has_sig){alert(L().needSig);TAB='sig';renderMain();return;}
  modal(ids);
}
function modal(ids){
  var ov=document.createElement('div');ov.className='mdl';
  ov.innerHTML='<div class="card"><h2>'+L().mTitle+'</h2><p class="small">'+esc(L().mTxt(ids.length))+'</p>'
    +(ME.sig?'<img class="sigimg" src="'+esc(ME.sig)+'" alt=""><div class="small muted" style="margin-top:4px">'+esc(ME.sig_name)+'</div>':'')
    +'<label class="chk"><input type="checkbox" id="mcons"> <span class="small">'+esc(STMT)+'</span></label>'
    +'<div id="merr"></div><div class="row" style="margin-top:10px"><button class="btn red" id="mok">'+L().signNow+'</button><button class="btn ghost" id="mno">'+L().cancel+'</button></div></div>';
  document.body.appendChild(ov);
  $('mno').addEventListener('click',function(){ov.remove();});
  $('mok').addEventListener('click',function(){
    if(!$('mcons').checked)return note('merr',L().err.consent);
    var b=this;b.disabled=true;b.textContent=L().working;note('merr','');
    post('/sign',{ids:ids,consent:true}).then(function(j){
      var ok=j.results.filter(function(x){return x.ok;}).length,f=j.results.length-ok;ov.remove();
      return loadList().then(function(){$('pane').insertAdjacentHTML('afterbegin','<div class="note ok">'+esc(L().done(ok,f))+'</div>');});
    }).catch(function(e){note('merr',e.message);b.disabled=false;b.textContent=L().signNow;});
  });
}
function renderSig(){
  var h='<h2 style="font-size:17px;margin:4px 0">'+L().sigTitle+'</h2><p class="muted small">'+L().sigTxt+'</p>'
    +(ME.has_sig?'<img class="sigimg" src="'+esc(ME.sig)+'" alt=""><p class="small muted">'+esc(ME.sig_name)+' · '+L().sigSaved+': '+esc(ME.sig_at)+'</p>':'<p class="muted small">'+L().sigNone+'</p>')
    +'<label class="f">'+L().sigName+'<input class="in" id="sn" value="'+esc(ME.sig_name||'')+'"></label>'
    +'<p class="small muted" style="margin:14px 0 6px">'+L().sigDraw+'</p><div class="pad"><canvas id="pad"></canvas><div class="ln"></div><div class="ph" id="ph">'+L().sigHere+'</div></div>'
    +'<div class="row" style="margin:8px 0"><button class="btn ghost sm" id="clr" type="button">'+L().clear+'</button></div>'
    +'<div id="serr"></div><div class="row"><button class="btn red" id="ssv">'+L().sigSave+'</button></div>';
  $('pane').innerHTML=h;
  PAD=pad($('pad'),'ph');$('clr').addEventListener('click',function(){PAD.clear();});
  $('ssv').addEventListener('click',function(){
    var nm=($('sn').value||'').trim();if(nm.length<3)return note('serr',L().err.bad_name);if(PAD.isEmpty())return note('serr',L().err.bad_signature);
    var b=this;b.disabled=true;
    post('/signature',{name:nm,sig:PAD.jpeg()}).then(function(){return post('/me');}).then(function(j){ME=j.me;renderMain();note('serr',L().saved,'ok');}).catch(function(e){note('serr',e.message);b.disabled=false;});
  });
}
function pad(cv,ph){
  var ctx,drawing=false,last=null,dirty=false;
  function size(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14244a';dirty=false;$(ph).style.display='';}
  size();
  function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  cv.addEventListener('pointerdown',function(e){drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);$(ph).style.display='none';e.preventDefault();});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true;e.preventDefault();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){cv.addEventListener(ev,function(){drawing=false;});});
  return {isEmpty:function(){return !dirty;},clear:function(){size();},jpeg:function(){var w=900,h=Math.round(cv.height/cv.width*900),o=document.createElement('canvas');o.width=w;o.height=h;var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(cv,0,0,w,h);return o.toDataURL('image/jpeg',0.85);}};
}
// indulás: van-e érvényes munkamenet
post('/me').then(function(j){ME=j.me;STMT=j.statement;if(I18N[ME.lang]){try{if(!localStorage.getItem('ca_partner_lang'))LANG=ME.lang;}catch(e){LANG=ME.lang;}$('lang').value=LANG;}render();if(!ME.must_change)loadList();}).catch(function(){ME=null;renderLogin();});
})();
