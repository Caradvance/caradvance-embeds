<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Bérleti szerződés — CarAdvance</title>
<link rel="icon" href="/favicon-32.png">
<!-- ca-tracking:start --><!-- Ezen az oldalon szándékosan nincs követőkód (személyes adatok, okmányok). --><!-- ca-tracking:end -->
<style>
:root{--red:#E2001A;--red2:#B80015;--ink:#0F172A;--ink2:#334155;--mut:#5A6B82;--mut2:#7A8496;--line:#E6EAF1;--bg:#F4F5F7;--card:#fff;--ok:#16A34A;--ok2:#15803D;--okbg:#DCFCE7;--warn:#92400E;--warnbg:#FEF3C7;--errbg:#FDE8EB;--navy:#0B2A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red)}
.top{background:#0B0B0D;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.top img{height:34px;display:block}
.top .num{color:#cbd2dc;font-size:13px}
.hero{background:radial-gradient(900px 300px at 85% -40%,rgba(226,0,26,.45),transparent 60%),linear-gradient(180deg,#0B0B0D,#151821);color:#fff;padding:26px 20px 70px}
.hero h1{margin:0 0 4px;font-size:26px;line-height:1.2;letter-spacing:-.01em}
.hero p{margin:0;color:#c9cfda}
.wrap{max-width:860px;margin:-48px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:19px}
.card h3{margin:18px 0 8px;font-size:15px}
.muted{color:var(--mut)} .small{font-size:13px}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 16px;padding:0;overflow-x:auto}
.steps li{flex:1;min-width:110px;background:#fff;border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut2);box-shadow:0 4px 14px rgba(15,23,42,.05);border-top:3px solid var(--line)}
.steps li b{display:block;font-size:13.5px;color:var(--ink2)}
.steps li.done{border-top-color:var(--ok)} .steps li.done b{color:var(--ok2)}
.steps li.cur{border-top-color:var(--red)} .steps li.cur b{color:var(--red)}
.test{background:#111;color:#ffb4bd;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 4px}
.sum div{background:#F7F9FC;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sum span{display:block;font-size:12px;color:var(--mut)} .sum b{font-size:15px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.seg label{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:600;background:#fff}
.seg input{margin-right:6px;accent-color:var(--red)}
.seg label.on{border-color:var(--red);background:#fff5f6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:600}
label.f i{color:var(--red);font-style:normal}
.in{width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:#F7F9FC;font:inherit;color:var(--ink)}
.in:focus{outline:none;border-color:var(--navy);background:#fff}
.in.bad{border-color:var(--red);background:#fff5f6}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--red);flex:none}
.docs{display:grid;gap:10px}
.doc{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.doc.ok{border-style:solid;border-color:#bfe8cd;background:#f6fdf8}
.doc.bad{border-color:var(--red);background:#fff5f6}
.doc .ic{width:38px;height:38px;border-radius:10px;background:#F1F4F9;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px;overflow:hidden}
.doc.ok .ic{background:var(--okbg);color:var(--ok2)}
.doc .ic img{width:100%;height:100%;object-fit:cover}
.doc .tx{flex:1;min-width:0}
.doc .tx b{display:block;font-size:14px}
.doc .tx span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:700 15px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none;background:#EEF2F7;color:var(--ink)}
.btn.red{background:var(--red);color:#fff} .btn.red:hover{background:var(--red2)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.err{background:var(--errbg);color:#9f1239}
.note.ok{background:var(--okbg);color:var(--ok2)}
.note.info{background:#EEF4FF;color:#1e3a8a}
.sec{border:1.5px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;background:#fff}
.sec>button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:10px;padding:14px 16px;font-weight:800;font-size:15.5px;position:sticky;top:0;background:#fff;z-index:1;border-bottom:1px solid var(--line);margin-bottom:10px}
.sec>button .st{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#F1F4F9;color:var(--mut)}
.sec.acc{border-color:#bfe8cd} .sec.acc>button .st{background:var(--okbg);color:var(--ok2)}
.sec .bd{padding:0 16px 14px;font-size:14.5px;color:var(--ink2)}
.sec.open .bd{display:block}
.sec .bd p{margin:0 0 10px} .sec .bd ul{margin:0 0 10px;padding-left:20px}
.sec .acc-line{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.pad{position:relative;border:1.5px solid var(--line);border-radius:16px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:190px;border-radius:16px;cursor:crosshair}
.pad .ph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b8c0cc;pointer-events:none;font-size:14px}
.pad .ln{position:absolute;left:18px;right:18px;bottom:38px;border-bottom:1.5px solid #dfe5ee;pointer-events:none}
.code{font:700 26px/1 "Courier New",monospace;letter-spacing:8px;text-align:center;max-width:220px}
table.ch{width:100%;border-collapse:collapse;font-size:14px}
table.ch td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#F1F4F9;color:var(--mut)}
.chip.paid{background:var(--okbg);color:var(--ok2)} .chip.due{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--errbg);color:#9f1239}
.drv{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:#FBFCFE}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
.btn:not(.red) .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.big{font-size:22px;font-weight:800}
.foot{text-align:center;color:var(--mut2);font-size:12.5px;margin:20px 0 40px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.card{padding:18px;border-radius:18px}.hero h1{font-size:22px}}
</style>
</head>
<body>
<div class="top"><a href="/"><img src="/caradvance-logo-white.webp" alt="CarAdvance" width="150" height="34"></a><span class="num" id="num"></span></div>
<div class="hero"><h1 id="h1">Bérleti szerződés</h1><p id="sub">Betöltés…</p></div>
<div class="wrap"><div id="app"><div class="card">Betöltés…</div></div>
<p class="foot">Caradvance GmbH · Bgm-Graf-Ring 21 · D-82538 Geretsried · Magyarországi képviselet: BH Group Zrt.<br>Kérdés esetén: <a href="tel:+36302146989">+36 30 214 6989</a> · <a href="mailto:info@caradvance.hu">info@caradvance.hu</a> · <a href="/adatkezeles/" target="_blank">Adatkezelés</a></p></div>
<script>
(function(){
'use strict';
var Q=new URLSearchParams(location.search), T=Q.get('t')||'', API='/api/szerzodes/'+T, S=null, app=document.getElementById('app'), saveTimer=null, opened={}, sigPad=null, sigPad2=null, codeSent=false, localPrev={}, LANG='hu', CO=9;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v,c){var n=Number(v)||0,d=c==='HUF'?0:(Math.round(n*100)%100?2:0);var s=n.toFixed(d).replace('.',',').split(',');return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(s[1]?','+s[1]:'')+(c==='HUF'?' Ft':' €')}
function hd(d){if(!d)return '—';var p=String(d).slice(0,10).split('-');return p[0]+'. '+p[1]+'. '+p[2]+'.'}
function api(path,data,raw){var o={method:data||raw?'POST':'GET',credentials:'same-origin',headers:{}};if(raw){o.body=raw.body;o.headers=raw.headers}else if(data){o.headers['Content-Type']='application/json';o.body=JSON.stringify(data)}
  return fetch(API+(path?'/'+path:''),o).then(function(r){return r.json().catch(function(){return {ok:false,error:'http_'+r.status}}).then(function(j){j._status=r.status;return j})})}
var ERR={not_found:'A link érvénytelen vagy a szerződést visszavonták. Kérjük, keresd kollégánkat.',locked:'Ez a lépés most nem érhető el – frissítsd az oldalt.',too_many:'Túl sok próbálkozás, kérjük, várj egy kicsit.',too_big:'A fájl túl nagy (max. 1,4 MB). Fotónál próbáld újra, PDF-nél kisebb fájlt tölts fel.',bad_type:'Csak JPG, PNG, WEBP kép vagy PDF tölthető fel.',wrong_code:'Hibás kód (bérlő).',wrong_code2:'Hibás kód (bérlőtárs).',co_email:'A bérlőtársnak saját, a bérlőétől eltérő e-mail cím kell (oda küldjük az aláírási kódját).',bad_co_name:'Írd be a bérlőtárs teljes nevét.',bad_co_signature:'A bérlőtársnak is alá kell írnia a mezőben.',code_expired:'A kód lejárt – kérj újat.',bad_signature:'Kérjük, írd alá a szerződést a mezőben.',bad_name:'Írd be a teljes nevedet.',not_all_accepted:'Minden fejezetet el kell fogadni.',mail_not_configured:'Az e-mail küldés most nem elérhető. Kérjük, hívj minket.',stripe_not_configured:'A kártyás fizetés még nincs bekapcsolva. Kollégánk hamarosan keres.',server_error:'Váratlan hiba történt. Kérjük, próbáld újra.',incomplete:'Néhány adat vagy okmány még hiányzik (pirossal jelölve).'};
function errMsg(j){return ERR[j.error]||('Hiba: '+(j.error||'ismeretlen'))}
var FL={email:'E-mail cím',address_card_number:'Lakcímkártya száma',name:'Teljes név',birth_date:'Születési dátum',birth_place:'Születési hely',address:'Lakcím',phone:'Telefonszám',id_type:'Okmány',id_number:'Okmányszám',licence_number:'Jogosítvány száma',licence_since:'Jogosítvány megszerzésének éve',licence_expiry:'Jogosítvány érvényessége',ev_number:'EV nyilvántartási szám',tax_number:'Adószám',company_name:'Cégnév',reg_number:'Cégjegyzékszám',seat:'Székhely',signer_role:'Beosztás'};
var ICON={id_front:'🪪',id_back:'🪪',passport:'🛂',licence_front:'🚗',licence_back:'🚗',address_front:'🏠',specimen:'✍️',poa:'📄',extract:'🏢'};

function load(){return api('').then(function(j){if(!j.ok){fatal(errMsg(j));return}S=j;render()})}
function fatal(m){document.getElementById('sub').textContent='';app.innerHTML='<div class="card"><h2>Nem elérhető</h2><p class="muted">'+esc(m)+'</p></div>'}

function stepIdx(st){return {draft:0,sent:0,changes:0,review:1,approved:2,signed:3,active:4,closed:4}[st]||0}
function stepsHtml(){var st=S.contract.status,i=stepIdx(st),L=[['1. lépés','Adatok, okmányok'],['2. lépés','Ellenőrzés'],['3. lépés','Elolvasás, aláírás'],['4. lépés',S.contract.terms.billing==='card'?'Kártyás fizetés':'Fizetés'],['Kész','Aktív bérlés']];
  return '<ol class="steps">'+L.map(function(x,k){return '<li class="'+(k<i||(k===4&&i===4)?'done':k===i?'cur':'')+'"><b>'+x[1]+'</b>'+x[0]+'</li>'}).join('')+'</ol>'}
function sumHtml(){var t=S.contract.terms,c=t.currency;return '<div class="sum"><div><span>Autó</span><b>'+esc(t.car||'—')+'</b></div><div><span>Havi díj</span><b>'+money(t.monthly,c)+'</b></div><div><span>Óvadék (kaució)</span><b>'+money(t.deposit,c)+(t.deposit_upfront?'':' *')+'</b></div><div><span>Km-keret</span><b>'+Number(t.km_month).toLocaleString('hu-HU')+' km/hó</b></div><div><span>Minimális időtartam</span><b>'+t.min_months+' hónap</b></div><div><span>Tervezett átadás</span><b>'+hd(t.handover_planned)+'</b></div></div>'+(t.deposit_upfront?'':'<p class="small muted">* Az óvadékot csak káresemény esetén, felhívásra kell megfizetni (5.5 pont).</p>')}

function render(){
  var c=S.contract;document.getElementById('num').textContent=c.number;
  document.getElementById('h1').textContent=c.terms.car?('Bérleti szerződés – '+c.terms.car):'Bérleti szerződés';
  document.getElementById('sub').textContent=c.status_hu;
  var h=(c.test?'<div class="test">TESZT-SZERZŐDÉS – nem éles, valódi fizetés nem történik.</div>':'')+stepsHtml();
  var st=c.status;
  if(st==='draft')h+='<div class="card"><h2>A szerződés előkészítés alatt</h2><p class="muted">Kollégánk még dolgozik rajta. Amint elkészül, e-mailben értesítünk.</p></div>';
  else if(st==='sent'||st==='changes')h+=viewDocs();
  else if(st==='review')h+=viewReview();
  else if(st==='approved')h+=viewSign();
  else if(st==='signed')h+=viewPay();
  else h+=viewActive();
  app.innerHTML=h;bind();
}

/* ---------------- 1. adatok + okmányok ---------------- */
function pobj(p){var cu=S.contract.cust;return p===CO?(cu.co||{}):p?((cu.drivers||[])[p-1]||{}):cu}
function fld(k,p,o){o=o||{};var v=pobj(p)[k];var bad=S._miss&&S._miss.indexOf(p===CO?('co.'+k):p?('drivers.'+(p-1)+'.'+k):k)>=0;
  var req=o.req!==false;var id='f_'+p+'_'+k;var inp;
  if(o.sel)inp='<select class="in'+(bad?' bad':'')+'" id="'+id+'" data-k="'+k+'" data-p="'+p+'">'+o.sel.map(function(x){return '<option value="'+x[0]+'"'+(v===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>';
  else inp='<input class="in'+(bad?' bad':'')+'" id="'+id+'" data-k="'+k+'" data-p="'+p+'" type="'+(o.type||'text')+'" value="'+esc(v||'')+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.ac?' autocomplete="'+o.ac+'"':'')+(o.im?' inputmode="'+o.im+'"':'')+'>';
  return '<label class="f'+(o.full?' full':'')+'">'+esc(o.label||FL[k])+(req?' <i>*</i>':'')+inp+'</label>'}
function personFields(p,ctype){var cu=pobj(p);var full=(p===0||p===CO);var h='<div class="grid">';
  h+=fld('name',p,{ac:p?'off':'name',label:ctype==='ceg'&&!p?'A képviselő teljes neve':'Teljes név (az okmány szerint)'})+fld('birth_date',p,{type:'date'});
  if(full)h+=fld('birth_place',p,{req:false})+(p===CO?fld('email',CO,{type:'email',label:'A bérlőtárs saját e-mail címe (ide kapja az aláírási kódot)'}):'')+fld('phone',p,{type:'tel',ac:p?'off':'tel',req:p!==CO})+fld('address',p,{full:true,ac:p?'off':'street-address',ph:'Irányítószám, település, utca, házszám'});
  h+=fld('id_type',p,{sel:[['id','Személyi igazolvány'],['passport','Útlevél']]})+fld('id_number',p)+(full&&ctype!=='ceg'?fld('address_card_number',p,{req:false,label:'Lakcímkártya száma (ha van)'}):'');
  var drives=p||ctype!=='ceg'||S.contract.cust.signer_drives;
  if(drives)h+=fld('licence_number',p)+fld('licence_since',p,{type:'number',im:'numeric',ph:'pl. 2012'})+(p&&p!==CO?'':fld('licence_expiry',p,{type:'date',req:false}));
  h+='</div>';
  var w=softWarn(cu,drives);if(w)h+='<div class="note warn small">'+w+'</div>';
  return h}
function softWarn(p,drives){if(!drives)return '';var out=[];var t=S.today;if(p.birth_date){var a=age(p.birth_date,t);if(a!=null&&a<25)out.push('A bérleti feltételek szerint a vezetőnek legalább 25 évesnek kell lennie – kollégánk egyedileg dönt.')}
  if(p.licence_since&&Number(t.slice(0,4))-Number(p.licence_since)<3)out.push('A feltételek szerint legalább 3 éve kell jogosítvánnyal rendelkezni – kollégánk egyedileg dönt.');return out.join('<br>')}
function age(b,t){var x=b.split('-').map(Number),y=t.split('-').map(Number);return y[0]-x[0]-((y[1]<x[1]||(y[1]===x[1]&&y[2]<x[2]))?1:0)}
function docSlots(p){var kinds=(S.persons.filter(function(x){return x.person===p})[0]||{kinds:[]}).kinds.slice();
  if(p===0&&S.contract.ctype!=='ceg')kinds.push('address_front');if(p===0&&S.contract.ctype==='ceg')kinds.push('extract');
  return '<div class="docs">'+kinds.map(function(k){var f=S.files.filter(function(x){return x.kind===k&&x.person===p})[0];var miss=S._missd&&S._missd.some(function(m){return m.kind===k&&m.person===p});var lk=k+':'+p;
    return '<div class="doc'+(f?' ok':miss?' bad':'')+'" data-slot="'+lk+'"><div class="ic">'+(f&&localPrev[lk]?'<img src="'+localPrev[lk]+'" alt="">':(f?'✓':(ICON[k]||'📄')))+'</div><div class="tx"><b>'+esc(S.kinds[k]||k)+'</b><span>'+(f?esc((f.name||'feltöltve')+' · '+Math.round(f.size/1024)+' KB'):'Fotózd le vagy válassz fájlt (JPG, PNG, PDF)')+'</span></div>'+
      '<label class="btn sm'+(f?' ghost':' red')+'">'+(f?'Csere':'Feltöltés')+'<input type="file" accept="image/*,application/pdf" hidden data-up="'+lk+'"></label>'+(f&&k!=='x'?'<button class="btn sm ghost" data-del="'+f.id+'" title="Törlés">✕</button>':'')+'</div>'}).join('')+'</div>'}
function viewDocs(){var c=S.contract,cu=c.cust,ct=c.ctype;var h='';
  if(c.status==='changes'&&c.review_note)h+='<div class="card"><div class="note warn"><b>Kérjük, javítsd vagy pótold:</b><br>'+esc(c.review_note).replace(/\n/g,'<br>')+'</div></div>';
  h+='<div class="card"><h2>1. Adataid és okmányaid</h2><p class="muted small">Az adatokat automatikusan mentjük, később is folytathatod. Az okmányfotókat a feltöltés előtt a telefonod tömöríti, és „Csak Caradvance bérléshez” vízjelet kapnak.</p>'+sumHtml()+
   '<h3>Ki köti a szerződést?</h3><div class="seg">'+[['magan','Magánszemély'],['ev','Egyéni vállalkozó'],['ceg','Cég']].map(function(x){return '<label class="'+(ct===x[0]?'on':'')+'"><input type="radio" name="ctype" value="'+x[0]+'"'+(ct===x[0]?' checked':'')+'>'+x[1]+'</label>'}).join('')+'</div>';
  if(ct==='ceg'){h+='<h3>Cégadatok</h3><div class="grid">'+fld('company_name',0,{full:true})+fld('reg_number',0,{ph:'pl. 01-09-123456'})+fld('tax_number',0,{ph:'pl. 12345678-2-42'})+fld('seat',0,{full:true})+'</div>'+
    '<h3>Az aláíró képviselő</h3>'+personFields(0,ct)+'<div class="grid">'+fld('signer_role',0,{ph:'pl. ügyvezető'})+'</div>'+

function prep(file){return new Promise(function(res,rej){

  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){try{var max=1800,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    var txt='Csak Caradvance bérléshez · '+new Date().toLocaleDateString('hu-HU');x.save();x.translate(w/2,h/2);x.rotate(-Math.atan2(h,w));x.font='bold '+Math.max(18,Math.round(w/26))+'px Arial';x.fillStyle='rgba(226,0,26,0.22)';x.textAlign='center';
    var step=Math.max(60,Math.round(w/9));for(var yy=-h;yy<=h;yy+=step*2)x.fillText(txt,0,yy);x.restore();URL.revokeObjectURL(url);
    var q=0.82;(function out(){cv.toBlob(function(b){if(!b)return rej({error:'bad_type'});if(b.size>1350*1024&&q>0.5){q-=0.12;return out()}res({blob:b,type:'image/jpeg',preview:cv.toDataURL('image/jpeg',0.3)})},'image/jpeg',q)})()}catch(e){rej({error:'bad_type'})}};
  img.onerror=function(){URL.revokeObjectURL(url);if(file.size<=1400*1024&&/jpe?g|png|webp/i.test(file.type))return res({blob:file,type:file.type});rej({error:'bad_type'})};img.src=url})}

function initPad(id,ph,setter){var cv=$('#'+id);if(!cv)return;var r=window.devicePixelRatio||1,box=cv.getBoundingClientRect();cv.width=Math.round(box.width*r);cv.height=Math.round(box.height*r);var x=cv.getContext('2d');x.scale(r,r);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b1a3a';
  var drawing=false,last=null,pts=0;setter({cv:cv,count:function(){return pts},clear:function(){x.clearRect(0,0,cv.width,cv.height);pts=0;$('#'+ph).style.display='';checkSign()}});
  function pos(e){var b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
  cv.addEventListener('pointerdown',function(e){if(cv.dataset.off)return;drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);$('#'+ph).style.display='none';e.preventDefault()});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);x.beginPath();x.moveTo(last.x,last.y);var mx=(last.x+p.x)/2,my=(last.y+p.y)/2;x.quadraticCurveTo(last.x,last.y,mx,my);x.lineTo(p.x,p.y);x.stroke();last=p;pts++;e.preventDefault()});

  ['dir','drives','hasco'].forEach(function(id){var e=$('#'+id);if(e)e.addEventListener('change',function(){save(true)})});
  app.querySelectorAll('[data-up]').forEach(function(inp){inp.addEventListener('change',function(){if(inp.files&&inp.files[0])upload(inp.getAttribute('data-up'),inp.files[0])})});
  app.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',function(){if(!confirm('Törlöd ezt a fájlt?'))return;api('fajl-torles',{id:Number(b.getAttribute('data-del'))}).then(function(j){if(j.ok){S.files=j.files.filter(function(f){return f.kind!=='signature'});render()}})})});
  var ad=$('#adddrv');if(ad)ad.addEventListener('click',function(){var cu=collect();cu.drivers.push({id_type:'id'});S.contract.cust=cu;api('adatok',{ctype:S.contract.ctype,cust:cu}).then(function(j){if(j.ok){S=j;render()}})});
  app.querySelectorAll('[data-rmdrv]').forEach(function(b){b.addEventListener('click',function(){if(!confirm('Eltávolítod ezt a vezetőt és a feltöltött okmányait?'))return;var cu=collect();cu.drivers.splice(Number(b.getAttribute('data-rmdrv')),1);api('adatok',{ctype:S.contract.ctype,cust:cu}).then(function(j){if(j.ok){S=j;render()}})})});
  var sb=$('#submit');if(sb)sb.addEventListener('click',submit);
  app.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-open');opened[id]=!opened[id];b.parentNode.classList.toggle('open',opened[id])})});
  app.querySelectorAll('[data-acc]').forEach(function(cb){cb.addEventListener('change',function(){var id=cb.getAttribute('data-acc');cb.disabled=true;api('elfogad',{section:id,value:cb.checked}).then(function(j){cb.disabled=false;if(!j.ok){cb.checked=!cb.checked;alert(errMsg(j));return}S.contract.accepted=j.accepted;
    if(cb.checked){opened[id]=false;var secs=S.sections.map(function(s){return s.id});var nx=secs[secs.indexOf(id)+1];if(nx&&!S.contract.accepted[nx])opened[nx]=true}
    var y=window.scrollY;var nm=($('#sname')||{}).value;render();if(nm&&$('#sname'))$('#sname').value=nm;var el=app.querySelector('[data-sec="'+id+'"]');window.scrollTo(0,y);if(el&&cb.checked){var nxe=el.nextElementSibling;if(nxe&&nxe.classList.contains('sec'))nxe.scrollIntoView({behavior:'smooth',block:'start'});else{var sc=$('#signcard');if(sc)sc.scrollIntoView({behavior:'smooth'})}}})})});
  if($('#pad'))initPad('pad','padph',function(o){sigPad=o});if($('#pad2'))initPad('pad2','padph2',function(o){sigPad2=o});
  var pc=$('#padclr');if(pc)pc.addEventListener('click',function(){sigPad&&sigPad.clear()});var pc2=$('#padclr2');if(pc2)pc2.addEventListener('click',function(){sigPad2&&sigPad2.clear()});
  var sn=$('#sname');if(sn)sn.addEventListener('input',checkSign);var sn2=$('#sname2');if(sn2)sn2.addEventListener('input',checkSign);
  var lg=$('#lang');if(lg)lg.addEventListener('click',function(){LANG=LANG==='hu'?'en':'hu';var y=window.scrollY;render();window.scrollTo(0,y)});
  var sc=$('#sendcode');if(sc)sc.addEventListener('click',function(){sc.disabled=true;sc.innerHTML='<span class="spin"></span> Küldés…';api('kod',{}).then(function(j){sc.disabled=false;if(!j.ok){sc.textContent='Kód küldése e-mailben';$('#signnote').innerHTML='<div class="note err">'+errMsg(j)+'</div>';return}codeSent=true;sc.textContent='Új kód kérése';$('#codebox').style.display='';$('#signnote').innerHTML='<div class="note ok small">Elküldtük a kódot a(z) '+esc(j.email)+(j.co_email?' és a(z) '+esc(j.co_email):'')+' címre (a spam mappát is nézd meg).</div>';$('#code').focus()})});
  ['code','code2'].forEach(function(id){var cd=$('#'+id);if(cd)cd.addEventListener('input',function(){cd.value=cd.value.replace(/\D/g,'').slice(0,6);checkSign()})});
  var sg=$('#signbtn');if(sg)sg.addEventListener('click',doSign);
  var pb=$('#pay');if(pb)pb.addEventListener('click',function(){pay(null,pb)});
  app.querySelectorAll('[data-paych]').forEach(function(b){b.addEventListener('click',function(){pay(Number(b.getAttribute('data-paych')),b)})});
  var cb=$('#card');if(cb)cb.addEventListener('click',function(){cb.disabled=true;api('kartya',{}).then(function(j){if(j.url)location.href=j.url;else{cb.disabled=false;alert(errMsg(j))}})});
}

if(!/^[a-f0-9]{40,64}$/.test(T)){fatal('Hiányzó vagy hibás link. Kérjük, nyisd meg újra az e-mailben kapott linket.');return}
var sid=Q.get('sid');
if(sid){app.innerHTML='<div class="card"><h2>Fizetés ellenőrzése…</h2><p class="muted">Egy pillanat.</p></div>';api('ellenorzes',{sid:sid}).then(function(j){if(j.ok){S=j;render()}else load();history.replaceState(null,'',location.pathname+'?t='+T+(j.verify&&j.verify.ok?'&sid=ok':''))})}
else load();
})();
</script>
</body>
</html>
