# Caradvance Offer Engine – TEST environment (Cloudflare account: Info@caradvance.hu's Account)
# Deployed by Workers Builds from GitHub: Caradvance/caradvance-embeds, branch ajanlatmotor-teszt, root caradvance-offers/
# Production will get its own [env.production] block behind Cloudflare Access on ajanlat.caradvance.hu.

name = "caradvance-offers-test"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Two UTC crons; the handler acts only at 08:00 Europe/Budapest (DST-safe).
[triggers]
crons = ["0 6 * * *", "0 7 * * *"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "test"
MOBILE_DE_SOURCE = "mock"            # mock | searchapi | apify
PUBLIC_BASE_URL = "https://caradvance-offers-test.flat-fire-7e25.workers.dev"
ADMIN_NOTIFY_TO = "info@caradvance.hu"
NOTIFY_FROM = "ajanlat@in.caradvance.hu"
AI_MODEL = "claude-sonnet-5-5"
DEPOT_LAT = "47.4979"
DEPOT_LON = "19.0402"
DEPOT_LABEL = "Budapest"
OFFER_VALID_DAYS = "7"
EXTENSION_ID = ""                    # empty = any chrome-extension origin (test)
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Test admin login: only the SHA-256 of the password is stored (password in TEST-CREDENTIALS.md, not in git)
ADMIN_PASSWORD_SHA256 = "bc87398aac0ceeba0d0b9793c599fa782d15895138bb19c0d294914b89c1fff7"
TOKEN_PEPPER = "09c7140ba795ea06b8a032a67d543746"

[[d1_databases]]
binding = "DB"
database_name = "caradvance-offers-test"
database_id = "c9e957c3-d388-4eca-bdef-73183fffe620"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "eaadc4a3024b44d68ba040430a912e16"

# R2 is not enabled on this account yet; offer images are stored in KV until it is.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "caradvance-offers-test-images"

# Outbound admin notifications (enable after info@caradvance.hu is a verified Email Routing destination)
# [[send_email]]
